name: Update All Market Data
on:
  schedule:
    # 韩股开盘 09:00-15:30 KST (00:00-06:30 UTC)
    - cron: '*/15 0-6 * * 1-5'
    # 港股开盘 09:30-16:00 HKT (01:30-08:00 UTC)
    - cron: '*/15 7-8 * * 1-5'
    # 美股开盘 21:30-04:00 CST (13:30-20:00 UTC)
    - cron: '*/15 13-20 * * 1-5'
    # 休市时段
    - cron: '0 9,11,21,23 * * 1-5'
    # 周末
    - cron: '0 */6 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch all market data
        run: node fetch_all.js
      - name: Fetch Korean stocks
        run: node fetch_kr.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json kr_data.json
          git diff --staged --quiet || git commit -m "Auto update market data"
          git push