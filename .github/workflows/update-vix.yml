name: Update VIX & KOSPI Data

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install akshare --quiet

      - name: Install Longbridge CLI
        run: curl -sSL https://github.com/longbridge/longbridge-terminal/raw/main/install | sh

      - name: Setup Longbridge token
        env:
          LB_TOKEN_JSON: ${{ secrets.LONGBRIDGE_TOKEN }}
          LB_CLIENT_ID: ${{ secrets.LONGBRIDGE_CLIENT_ID }}
        run: |
          mkdir -p ~/.longbridge/openapi/tokens
          echo "$LB_TOKEN_JSON" > ~/.longbridge/openapi/tokens/$LB_CLIENT_ID
          echo "cn" > ~/.longbridge/openapi/region-cache
          longbridge check || echo "Longbridge check failed, will fallback to Yahoo"

      - name: Fetch data
        env:
          LONGBRIDGE_REGION: cn
        run: |
          python3 << 'PYEOF'
          import json, datetime, sys, urllib.request, os, subprocess

          now = datetime.datetime.utcnow()
          now_str = now.isoformat() + "Z"

          def read_json(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except:
                  return None

          def save_json(path, data):
              with open(path, "w") as f:
                  json.dump(data, f, ensure_ascii=False)

          def yahoo_quote(yahoo_code):
              """只获取最新价，range=1d最省流量"""
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{yahoo_code}?interval=1d&range=1d"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              data = json.loads(urllib.request.urlopen(req, timeout=10).read())
              m = data["chart"]["result"][0]["meta"]
              p = m["regularMarketPrice"]
              prev = m.get("chartPreviousClose", m.get("previousClose", p))
              return p, prev

          def yahoo_kline(yahoo_code, days):
              """获取K线数据，根据需要的天数动态调整range"""
              if days <= 5: rng = "5d"
              elif days <= 30: rng = "1mo"
              elif days <= 90: rng = "3mo"
              elif days <= 180: rng = "6mo"
              else: rng = "1y"
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{yahoo_code}?interval=1d&range={rng}"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              data = json.loads(urllib.request.urlopen(req, timeout=15).read())
              res = data["chart"]["result"][0]
              ts = res["timestamp"]
              q = res["indicators"]["quote"][0]
              klines = []
              for i in range(len(ts)):
                  if q["open"][i] is None: continue
                  dt = datetime.datetime.utcfromtimestamp(ts[i])
                  klines.append({
                      "date": dt.strftime("%Y-%m-%d"),
                      "open": round(q["open"][i], 2),
                      "close": round(q["close"][i], 2),
                      "high": round(q["high"][i], 2),
                      "low": round(q["low"][i], 2),
                      "vol": q["volume"][i] if q.get("volume") and q["volume"][i] else 0
                  })
              return klines

          def update_kline(kline_path, yahoo_code):
              """增量更新K线：读已有数据，算缺几天，只拉缺失部分追加"""
              existing = read_json(kline_path)
              existing_klines = existing.get("klines", []) if existing else []
              
              if existing_klines:
                  last_date = existing_klines[-1]["date"]
                  last_dt = datetime.datetime.strptime(last_date, "%Y-%m-%d")
                  gap_days = (now - last_dt).days
                  if gap_days <= 0:
                      # 今天已有数据，只更新当天最新价（盘中）
                      gap_days = 1
              else:
                  # 没有历史数据，拉300天初始化
                  gap_days = 300

              print(f"  K线增量: 已有{len(existing_klines)}条, 缺{gap_days}天")
              
              try:
                  new_klines = yahoo_kline(yahoo_code, gap_days + 5)  # 多拉几天保险
              except Exception as e:
                  print(f"  K线拉取失败: {e}", file=sys.stderr)
                  return

              if not new_klines:
                  return

              # 合并：用 date 作为 key 去重
              kline_map = {k["date"]: k for k in existing_klines}
              for k in new_klines:
                  kline_map[k["date"]] = k  # 新数据覆盖旧的（更新当天盘中）
              
              merged = sorted(kline_map.values(), key=lambda x: x["date"])
              # 只保留最近300个交易日
              if len(merged) > 300:
                  merged = merged[-300:]
              
              save_json(kline_path, {"symbol": yahoo_code, "updated": now_str, "klines": merged})
              print(f"  K线更新完成: {len(merged)}条, 最新={merged[-1]['date']}")

          # ==========================================
          # Longbridge CLI helper
          # ==========================================
          def lb_quote(symbol):
              """用 Longbridge CLI 获取实时行情"""
              try:
                  out = subprocess.check_output(
                      ["longbridge", "quote", symbol, "--format", "json"],
                      timeout=15, stderr=subprocess.DEVNULL
                  )
                  data = json.loads(out)
                  if not data or len(data) == 0:
                      return None
                  d = data[0]
                  price = float(d["last"])
                  prev = float(d["prev_close"])
                  chg = round(price - prev, 2)
                  pct = round((chg / prev) * 100, 2) if prev else 0
                  return {"price": price, "change": chg, "pct": pct, "prev": prev}
              except Exception as e:
                  print(f"  Longbridge quote error: {e}", file=sys.stderr)
                  return None

          def lb_kline(symbol, period, count=300):
              """用 Longbridge CLI 获取K线"""
              try:
                  out = subprocess.check_output(
                      ["longbridge", "kline", symbol, "--period", period, "--count", str(count), "--format", "json"],
                      timeout=15, stderr=subprocess.DEVNULL
                  )
                  data = json.loads(out)
                  if not data or len(data) == 0:
                      return None
                  klines = []
                  for d in data:
                      # time 格式: "2026-04-02 04:00:00" 或 "2026-04-02 19:10:00"
                      t = d["time"]
                      if period in ("day", "week", "month", "year"):
                          date_str = t[:10]  # "2026-04-02"
                      else:
                          # 分钟K: 取月/日 时:分
                          dt = datetime.datetime.strptime(t, "%Y-%m-%d %H:%M:%S")
                          date_str = f"{dt.month}/{dt.day} {dt.hour}:{dt.minute:02d}"
                      klines.append({
                          "date": date_str,
                          "open": round(float(d["open"]), 2),
                          "close": round(float(d["close"]), 2),
                          "high": round(float(d["high"]), 2),
                          "low": round(float(d["low"]), 2),
                          "vol": int(d.get("volume", "0").replace(",", "")) if d.get("volume") else 0
                      })
                  return klines
              except Exception as e:
                  print(f"  Longbridge kline error ({symbol} {period}): {e}", file=sys.stderr)
                  return None

          # ==========================================
          # KOSPI
          # ==========================================
          print("=== KOSPI ===")
          kospi_data = None
          try:
              import akshare as ak
              df = ak.index_global_spot_em()
              row = df[df["代码"] == "KS11"]
              if len(row) > 0:
                  r = row.iloc[0]
                  kospi_data = {
                      "symbol": "KOSPI", "price": float(r["最新价"]),
                      "change": float(r["涨跌额"]), "pct": float(r["涨跌幅"]),
                      "prev": float(r["昨收价"]), "time": now_str, "source": "akshare"
                  }
                  print(f"✅ KOSPI: {kospi_data['price']} ({kospi_data['change']:+.2f}, {kospi_data['pct']:+.2f}%)")
          except Exception as e:
              print(f"AKShare error: {e}", file=sys.stderr)

          if not kospi_data:
              try:
                  p, prev = yahoo_quote("%5EKS11")
                  kospi_data = {"symbol": "KOSPI", "price": p, "change": round(p-prev,2),
                                "pct": round((p-prev)/prev*100,2), "prev": prev, "time": now_str, "source": "yahoo"}
                  print(f"✅ KOSPI (Yahoo): {p}")
              except Exception as e:
                  print(f"Yahoo KOSPI error: {e}", file=sys.stderr)

          if kospi_data:
              old = read_json("kospi.json")
              if not old or old.get("price") != kospi_data["price"]:
                  save_json("kospi.json", kospi_data)
              else:
                  print("⏭️ KOSPI 价格未变, 跳过")

          # KOSPI K线增量更新
          update_kline("kospi_kline.json", "%5EKS11")

          # ==========================================
          # VIX — Longbridge 首选, Yahoo 备用
          # ==========================================
          print("\n=== VIX ===")
          vix_data = None

          # 1) Longbridge CLI 获取 VIX 行情 (首选, 500ms稳定)
          lb_vix = lb_quote(".VIX.US")
          if lb_vix:
              vix_data = {
                  "symbol": "VIX", "price": lb_vix["price"],
                  "change": lb_vix["change"], "pct": lb_vix["pct"],
                  "prev": lb_vix["prev"], "time": now_str, "source": "longbridge"
              }
              print(f"✅ VIX (Longbridge): {vix_data['price']} ({vix_data['change']:+.2f}, {vix_data['pct']:+.2f}%)")

          # 2) Yahoo 备用
          if not vix_data:
              print("  Longbridge失败, 尝试Yahoo...")
              try:
                  p, prev = yahoo_quote("%5EVIX")
                  vix_data = {"symbol": "VIX", "price": p, "change": round(p-prev,2),
                              "pct": round((p-prev)/prev*100,2), "prev": prev, "time": now_str, "source": "yahoo"}
                  print(f"✅ VIX (Yahoo): {p}")
              except Exception as e:
                  print(f"Yahoo VIX error: {e}", file=sys.stderr)

          if vix_data:
              old = read_json("vix.json")
              if not old or old.get("price") != vix_data["price"]:
                  save_json("vix.json", vix_data)
              else:
                  print("⏭️ VIX 价格未变, 跳过")

          # ==========================================
          # VIX K线 — Longbridge 全周期 (首选, ~500ms/周期)
          # Yahoo 只能通过CORS代理获取日K, Longbridge 支持全部7个周期
          # ==========================================
          print("\n=== VIX K线 (Longbridge 全周期) ===")

          # 周期映射: 前端klt代码 → Longbridge period名
          VIX_PERIODS = {
              "101": {"lb": "day",   "count": 300, "name": "日K"},
              "102": {"lb": "week",  "count": 200, "name": "周K"},
              "103": {"lb": "month", "count": 200, "name": "月K"},
              "5":   {"lb": "5m",    "count": 200, "name": "5分K"},
              "15":  {"lb": "15m",   "count": 200, "name": "15分K"},
              "30":  {"lb": "30m",   "count": 200, "name": "30分K"},
              "60":  {"lb": "1h",    "count": 200, "name": "60分K"},
          }

          vix_kline_all = {}
          lb_ok = 0
          for klt, cfg in VIX_PERIODS.items():
              klines = lb_kline(".VIX.US", cfg["lb"], cfg["count"])
              if klines and len(klines) > 0:
                  vix_kline_all[klt] = klines
                  lb_ok += 1
                  print(f"  ✅ VIX {cfg['name']}: {len(klines)}条 (Longbridge)")
              else:
                  print(f"  ❌ VIX {cfg['name']}: Longbridge失败")

          if lb_ok > 0:
              # 保存全周期 JSON: { "updated": "...", "source": "longbridge", "periods": { "101": [...], "5": [...], ... } }
              save_json("vix_kline_lb.json", {
                  "symbol": "VIX",
                  "updated": now_str,
                  "source": "longbridge",
                  "periods": vix_kline_all
              })
              print(f"\n✅ vix_kline_lb.json 已保存 ({lb_ok}/{len(VIX_PERIODS)} 周期)")

          # 仍然保留 vix_kline.json 日K兜底 (兼容旧前端)
          if "101" in vix_kline_all:
              save_json("vix_kline.json", {
                  "symbol": "%5EVIX",
                  "updated": now_str,
                  "klines": vix_kline_all["101"]
              })
              print("✅ vix_kline.json 日K兜底已更新")
          else:
              # Longbridge 日K也失败, 用 Yahoo 兜底
              print("  VIX 日K Longbridge失败, Yahoo兜底...")
              update_kline("vix_kline.json", "%5EVIX")

          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vix.json kospi.json vix_kline.json kospi_kline.json vix_kline_lb.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes, skip push"
          else
            git commit -m "auto: update VIX+KOSPI $(date -u +%H:%M)"
            git push
          fi