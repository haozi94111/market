<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="市场看板">
    <meta name="theme-color" content="#0a0e17">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <title>全球市场看板</title>
    <style>
        :root {
            --bg: #060b14; --bg2: #0f1621; --bg3: #182030; --border: #1c2740;
            --t1: #f1f5f9; --t2: #94a3b8; --t3: #4a5b78;
            --up: #ef4444; --up-bg: rgba(239,68,68,0.07); --up-bd: rgba(239,68,68,0.18);
            --dn: #22c55e; --dn-bg: rgba(34,197,94,0.07); --dn-bd: rgba(34,197,94,0.18);
            --acc: #3b82f6; --acc2: #8b5cf6; --gold: #f59e0b;
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t1);min-height:100dvh;overflow-x:hidden}

        /* Header */
        .hdr{position:sticky;top:0;z-index:100;background:rgba(6,11,20,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:14px 20px}
        .hdr-in{max-width:840px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
        .hdr-l{display:flex;align-items:center;gap:12px}
        .logo{width:38px;height:38px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 12px rgba(59,130,246,0.25)}
        .hdr-t{font-size:17px;font-weight:800;letter-spacing:-0.4px;background:linear-gradient(90deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .hdr-st{font-size:10px;color:var(--t3);margin-top:1px;letter-spacing:0.5px;text-transform:uppercase}
        .rbtn{display:flex;align-items:center;gap:7px;padding:9px 18px;background:linear-gradient(135deg,var(--acc),#6366f1);color:#fff;border:none;border-radius:11px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all .2s;box-shadow:0 2px 10px rgba(59,130,246,0.3)}
        .rbtn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,0.4)}
        .rbtn:active{transform:scale(.96)}
        .rbtn.loading .ri{animation:spin .8s linear infinite}
        @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
        .ri{font-size:14px;display:inline-block}

        /* Status */
        .sbar{max-width:840px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .sdot{width:7px;height:7px;border-radius:50%;background:var(--dn);animation:pulse 2s infinite;flex-shrink:0}
        .sdot.err{background:var(--up);animation:none}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .stime{font-size:13px;color:var(--t2);font-weight:500}
        .stime .s-label{color:var(--t3);font-weight:400}
        .stime .s-time{color:var(--t1);font-variant-numeric:tabular-nums}
        .snext{font-size:12px;color:var(--t2);margin-left:8px;padding:3px 10px;background:rgba(34,197,94,0.08);border-radius:6px;border:1px solid rgba(34,197,94,0.15)}
        .snext.closed{background:rgba(74,91,120,0.1);border-color:rgba(74,91,120,0.2);color:var(--t3)}

        /* Main */
        .main{max-width:840px;margin:0 auto;padding:0 14px 100px}

        /* Section */
        .sec{margin-bottom:20px}
        .sec-h{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
        .sec-i{font-size:18px}
        .sec-t{font-size:15px;font-weight:700;color:var(--t1)}
        .sec-b{font-size:10px;padding:2px 8px;background:rgba(59,130,246,0.1);color:var(--acc);border-radius:20px;font-weight:600;letter-spacing:0.3px}

        /* Grid */
        .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
        @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:840px){.grid.wide{grid-template-columns:repeat(4,1fr)}}

        /* Card */
        .card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px 14px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:14px 14px 0 0;opacity:0;transition:opacity .3s}
        .card.up{background:var(--up-bg);border-color:var(--up-bd)}.card.up::before{background:linear-gradient(90deg,var(--up),transparent);opacity:1}
        .card.down{background:var(--dn-bg);border-color:var(--dn-bd)}.card.down::before{background:linear-gradient(90deg,var(--dn),transparent);opacity:1}
        .card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
        .card:active{transform:scale(.98)}
        .c-name{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:10px;display:flex;align-items:center;gap:5px}
        .c-flag{font-size:13px}
        .c-price{font-size:24px;font-weight:800;letter-spacing:-0.5px;line-height:1.1;margin-bottom:7px;font-variant-numeric:tabular-nums}
        .card.up .c-price{color:var(--up)}.card.down .c-price{color:var(--dn)}.card.flat .c-price{color:var(--t2)}
        .c-chg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
        .card.up .c-chg{color:var(--up)}.card.down .c-chg{color:var(--dn)}.card.flat .c-chg{color:var(--t3)}
        .c-badge{padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700}
        .card.up .c-badge{background:rgba(239,68,68,0.13)}.card.down .c-badge{background:rgba(34,197,94,0.13)}
        .c-hint{font-size:9px;color:var(--t3);margin-top:6px;opacity:0;transition:opacity .3s}.card:hover .c-hint{opacity:1}

        /* Delay badge */
        .c-delay{position:absolute;top:6px;right:6px;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;line-height:1.2}
        .c-delay.d1{background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.3)}
        .c-delay.d2{background:rgba(245,158,11,0.15);color:#fbbf24;border:1px solid rgba(245,158,11,0.3)}
        .c-delay.d3{background:rgba(239,68,68,0.2);color:#ef4444;border:1px solid rgba(239,68,68,0.4);animation:delay-blink 1.5s infinite}
        @keyframes delay-blink{0%,100%{opacity:1}50%{opacity:0.5}}

        /* Loading skeleton */
        .card.ld .c-price,.card.ld .c-chg{background:linear-gradient(90deg,#1c2740 25%,#253350 50%,#1c2740 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:5px;color:transparent!important}
        .card.ld .c-price{width:75%;height:28px}.card.ld .c-chg{width:55%;height:16px}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

        /* Error */
        .c-err{display:none;position:absolute;inset:0;background:rgba(6,11,20,0.88);border-radius:14px;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:11px;color:var(--t3)}
        .card.error .c-err{display:flex}

        /* VIX star card */
        .card.star{border:1.5px solid #f59e0b;box-shadow:0 0 12px rgba(245,158,11,0.15)}
        .card.star .c-name{color:#f59e0b;font-weight:700}
        /* VIX danger: >30 */
        .card.vix-danger{border-color:#ef4444!important;box-shadow:0 0 20px rgba(239,68,68,0.35)!important;animation:vix-pulse 1.5s ease-in-out infinite}
        .card.vix-danger .c-price{color:#ef4444!important;font-size:32px!important;font-weight:900!important}
        .card.vix-danger .c-name{color:#ef4444!important}
        .card.vix-danger::before{background:linear-gradient(90deg,#ef4444,transparent)!important;opacity:1!important}
        @keyframes vix-pulse{0%,100%{box-shadow:0 0 20px rgba(239,68,68,0.35)}50%{box-shadow:0 0 35px rgba(239,68,68,0.6)}}

        /* Footer */
        .foot{text-align:center;padding:24px 20px;color:var(--t3);font-size:10px;line-height:1.8}

        /* Toast */
        .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:#1c2740;color:var(--t1);padding:10px 22px;border-radius:11px;font-size:13px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,0.4);border:1px solid var(--border);transition:transform .4s cubic-bezier(.16,1,.3,1);z-index:3000;white-space:nowrap}
        .toast.show{transform:translateX(-50%) translateY(0)}

        /* ===== Chart Modal ===== */
        .cmodal{display:none;position:fixed;inset:0;z-index:2000;background:var(--bg);flex-direction:column}
        .cmodal.active{display:flex}
        .cm-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
        .cm-title{font-size:15px;font-weight:700;color:var(--t1)}
        .cm-btns{display:flex;gap:6px}
        .cm-ref{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--t1);font-size:14px;cursor:pointer;transition:all .2s}
        .cm-ref:hover{background:var(--bg3)}.cm-ref:active{transform:scale(.95)}.cm-ref.spinning{animation:spin .8s linear infinite}
        .cm-back{padding:7px 16px;border-radius:8px;border:none;background:var(--up);color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s}
        .cm-back:hover{background:#dc2626}.cm-back:active{transform:scale(.95)}
        .cm-periods{display:flex;gap:5px;padding:8px 14px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch}
        .cm-periods::-webkit-scrollbar{display:none}
        .pbtn{padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .2s}
        .pbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
        .pbtn:hover:not(.on){border-color:var(--t3);color:var(--t1)}
        .psep{width:1px;background:var(--border);margin:0 3px;flex-shrink:0}

        /* MA toggle bar */
        .cm-ma{display:flex;gap:5px;padding:6px 14px;border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
        .ma-label{font-size:11px;color:var(--t3);margin-right:4px}
        .ma-btn{padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
        .ma-btn.on{color:#fff;border-width:2px}
        .ma-btn.on[data-ma="5"]{background:rgba(245,158,11,0.2);border-color:#f59e0b;box-shadow:0 0 6px rgba(245,158,11,0.3)}
        .ma-btn.on[data-ma="10"]{background:rgba(59,130,246,0.2);border-color:#3b82f6;box-shadow:0 0 6px rgba(59,130,246,0.3)}
        .ma-btn.on[data-ma="30"]{background:rgba(168,85,247,0.2);border-color:#a855f7;box-shadow:0 0 6px rgba(168,85,247,0.3)}
        .ma-btn.on[data-ma="200"]{background:rgba(239,68,68,0.2);border-color:#ef4444;box-shadow:0 0 6px rgba(239,68,68,0.3)}
        .ma-btn:not(.on){opacity:0.4;border-style:dashed}

        .cm-frame{flex:1;position:relative;background:var(--bg);min-height:0;overflow:hidden}
        .cm-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--t3);font-size:13px;z-index:10}
        .cm-loading.hidden{display:none}
        .cm-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}

        /* Market Status Bar - 分组显示 */
        .mkt-bar{max-width:840px;margin:0 auto;padding:8px 20px}
        .mkt-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;justify-content:center;padding:3px 0}
        .mkt-row+.mkt-row{border-top:1px solid rgba(255,255,255,0.04);margin-top:2px;padding-top:5px}
        .mkt-item{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
        .mkt-item .mi-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
        .mkt-item.open .mi-dot{background:#22c55e;box-shadow:0 0 6px #22c55e;animation:pulse 2s infinite}
        .mkt-item.closed .mi-dot{background:#3a4560}
        .mkt-item.holiday .mi-dot{background:#f59e0b}
        .mkt-item .mi-name{font-size:13px;font-weight:700}
        .mkt-item.open .mi-name{color:#22c55e}
        .mkt-item.closed .mi-name{color:var(--t3)}
        .mkt-item.holiday .mi-name{color:#f59e0b}
        .mkt-item .mi-status{font-size:11px;font-weight:500;opacity:0.7}
        .mkt-item.open .mi-status{color:rgba(34,197,94,0.8)}
        .mkt-item.closed .mi-status{color:var(--t3)}
        .mkt-item.holiday .mi-status{color:rgba(245,158,11,0.8)}
        .mkt-sep{width:1px;height:14px;background:var(--border);flex-shrink:0}

        /* Loading spinner for cards */
        .card.ld::after{content:'';position:absolute;top:50%;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border:3px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;z-index:5}

        /* K-line period loading spinner */
        .pbtn.loading::after{content:'';display:inline-block;width:10px;height:10px;margin-left:4px;border:2px solid transparent;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}

        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#253350;border-radius:3px}
    </style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
    <div class="hdr-l"><div class="logo">📊</div><div><div class="hdr-t">全球市场看板</div><div class="hdr-st">Global Market Dashboard</div></div></div>
    <button class="rbtn" id="refreshBtn" onclick="refreshAll()"><span class="ri">🔄</span><span>刷新</span></button>
</div></header>

<div class="mkt-bar" id="mktBar"></div>
<div class="sbar"><div class="sdot" id="statusDot"></div><span class="stime" id="updateTime">等待加载...</span><span class="snext" id="nextRefresh"></span></div>

<main class="main">
    <div class="sec"><div class="sec-h"><span class="sec-i">🛢️</span><span class="sec-t">大宗商品</span><span class="sec-b">Commodities</span></div><div class="grid" id="commodities"></div></div>
    <div class="sec"><div class="sec-h"><span class="sec-i">🇺🇸</span><span class="sec-t">美股市场</span><span class="sec-b">US Market</span></div><div class="grid" id="usMarket"></div></div>
    <div class="sec"><div class="sec-h"><span class="sec-i">🇭🇰</span><span class="sec-t">港股市场</span><span class="sec-b">HK Market</span></div><div class="grid" id="hkMarket"></div></div>
    <div class="sec"><div class="sec-h"><span class="sec-i">🇰🇷</span><span class="sec-t">韩国市场</span><span class="sec-b">Korea</span></div><div class="grid wide" id="krMarket"></div></div>
    <div class="sec"><div class="sec-h"><span class="sec-i">🇨🇳</span><span class="sec-t">A股市场</span><span class="sec-b">China A</span></div><div class="grid" id="cnMarket"></div></div>
</main>

<div class="foot">数据来源: 腾讯财经 / Longbridge / Naver / Yahoo Finance · 仅供参考，不构成投资建议<br>价格可能存在延迟 · 点击卡片查看K线图</div>

<!-- ECharts (国内CDN优先, jsdelivr备用) -->
<script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
<script>if(typeof echarts==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"><\/script>')}</script>

<!-- Chart Modal -->
<div class="cmodal" id="chartModal">
    <div class="cm-bar">
        <div class="cm-title" id="cmTitle">📈 K线图</div>
        <div class="cm-btns"><button class="cm-ref" onclick="refreshKline()">🔄</button><button class="cm-back" onclick="closeChart()">← 返回</button></div>
    </div>
    <div class="cm-periods">
        <button class="pbtn on" data-k="101" onclick="sp(this,101)">日K</button>
        <button class="pbtn" data-k="102" onclick="sp(this,102)">周K</button>
        <button class="pbtn" data-k="103" onclick="sp(this,103)">月K</button>
        <span class="psep"></span>
        <button class="pbtn" data-k="5" onclick="sp(this,5)">5分</button>
        <button class="pbtn" data-k="15" onclick="sp(this,15)">15分</button>
        <button class="pbtn" data-k="30" onclick="sp(this,30)">30分</button>
        <button class="pbtn" data-k="60" onclick="sp(this,60)">60分</button>
    </div>
    <div class="cm-ma">
        <span class="ma-label">均线</span>
        <button class="ma-btn on" data-ma="5" style="color:#f59e0b;border-color:#f59e0b55" onclick="toggleMA(this)">MA5</button>
        <button class="ma-btn on" data-ma="10" style="color:#3b82f6;border-color:#3b82f655" onclick="toggleMA(this)">MA10</button>
        <button class="ma-btn on" data-ma="30" style="color:#a855f7;border-color:#a855f755" onclick="toggleMA(this)">MA30</button>
        <button class="ma-btn" data-ma="200" style="color:#ef4444;border-color:#ef444455" onclick="toggleMA(this)">MA200</button>
    </div>
    <div class="cm-frame"><div class="cm-loading" id="cmLoading"><div class="cm-spinner"></div><span>加载K线数据...</span></div><div id="kChart" style="width:100%;height:100%"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
var CFG = {
    commodities:[
        {s:'BRENT',n:'布伦特原油',f:'🛢️',d:2},
        {s:'GOLD',n:'纽约黄金',f:'🥇',d:1}
    ],
    usMarket:[
        {s:'NASDAQ',n:'纳斯达克',f:'📈',d:2},
        {s:'SP500',n:'标普500',f:'📊',d:2},
        {s:'VIX',n:'VIX恐慌指数',f:'😱',d:2,star:true}
    ],
    hkMarket:[
        {s:'HSI',n:'恒生指数',f:'🇭🇰',d:2},
        {s:'HSTECH',n:'恒生科技',f:'🇭🇰',d:2}
    ],
    krMarket:[
        {s:'KOSPI',n:'韩国综合',f:'📊',d:2},
        {s:'SKHYNIX',n:'SK海力士',f:'💾',d:0},
        {s:'SAMSUNG',n:'三星电子',f:'📱',d:0}
    ],
    cnMarket:[
        {s:'SSEC',n:'上证指数',f:'🇨🇳',d:2},
        {s:'CSI500',n:'中证500',f:'🇨🇳',d:2}
    ]
};


// 腾讯财经代码映射 (主数据源！JSONP直连，无需代理，数据实时)
var QQ_CODES={
    BRENT:'hf_OIL',GOLD:'hf_GC',
    NASDAQ:'usNDX',SP500:'usINX',
    HSI:'hkHSI',HSTECH:'hkHSTECH',
    SSEC:'sh000001',CSI500:'sh000905',
    KOSPI:null,VIX:null  // 腾讯没有韩国和VIX数据，走Yahoo代理
};

// 东方财富 secid (K线图用)
var DFCF={BRENT:'112.B00Y',GOLD:'101.GC00Y',NASDAQ:'100.NDX',SP500:'100.SPX',HSI:'100.HSI',HSTECH:'124.HSTECH',SSEC:'1.000001',CSI500:'1.000905',KOSPI:'100.KS11'};

var NAMES={BRENT:'布伦特原油',GOLD:'纽约黄金',VIX:'VIX恐慌指数',NASDAQ:'纳斯达克',SP500:'标普500',HSI:'恒生指数',HSTECH:'恒生科技',KOSPI:'韩国综合',SKHYNIX:'SK海力士',SAMSUNG:'三星电子',SSEC:'上证指数',CSI500:'中证500'};

var MA_COLORS={5:'#f59e0b',10:'#3b82f6',30:'#a855f7',200:'#ef4444'};

// ===== JSONP (东方财富K线用) =====
var _cid=0;
function jsonpFetch(url,timeout){
    timeout=timeout||10000;
    return new Promise(function(ok,fail){
        var cb='_cb'+(++_cid)+'_'+Date.now();
        var u=url+(url.indexOf('?')>-1?'&':'?')+'cb='+cb+'&_='+Date.now();
        var s=document.createElement('script');
        var t=setTimeout(function(){cl();fail(new Error('timeout'))},timeout);
        function cl(){clearTimeout(t);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s)}
        window[cb]=function(d){cl();ok(d)};
        s.onerror=function(){cl();fail(new Error('err'))};

function parseQQData(qc,raw){
    var p=raw.split('~');
    // 外盘期货: hf_ 开头 → 格式: 价格,涨跌幅,开盘,高,高2,低,时间,昨收,...
    if(qc.indexOf('hf_')===0){
        var pp=raw.split(',');
        var price=parseFloat(pp[0]);
        var pct=parseFloat(pp[1]);
        var prevClose=parseFloat(pp[7]);
        if(!price)throw new Error('bad hf data');
        var chg=prevClose?(price-prevClose):0;
        return{price:price,change:Math.round(chg*100)/100,pct:pct};
    }
    // 股票/指数: ~分隔 → p[3]=当前价, p[4]=昨收, p[31]=涨跌额, p[32]=涨跌幅
    var price=parseFloat(p[3]);
    var prevClose=parseFloat(p[4]);
    if(!price||!prevClose)throw new Error('bad qq data');
    var chg=parseFloat(p[31])||0;
    var pct=parseFloat(p[32])||0;
    // 如果 p[31] 为空，手动算
    if(!chg&&!pct){chg=price-prevClose;pct=prevClose?((chg/prevClose)*100):0}
    return{price:price,change:Math.round(chg*1000)/1000,pct:Math.round(pct*100)/100};
}

// ===== Safari-safe timeout signal (AbortSignal.timeout 兼容) =====
function safeTimeoutSignal(ms){
    // Safari < 16 不支持 AbortSignal.timeout
    if(typeof AbortSignal!=='undefined'&&AbortSignal.timeout){
        try{return AbortSignal.timeout(ms)}catch(e){}
    }
    // Fallback: AbortController + setTimeout
    if(typeof AbortController!=='undefined'){
        var ac=new AbortController();
        setTimeout(function(){ac.abort()},ms);
        return ac.signal;
    }
    return undefined;
}

// ===== CORS Proxy helper (并发，每请求独立尝试) =====
var PROXY_LIST=[
    function(u){return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u)},
    function(u){return 'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u)},
    function(u){return 'https://corsproxy.io/?url='+encodeURIComponent(u)}
];
function corsFetch(url,timeout){
    timeout=timeout||12000;
    function tryProxy(idx){
        if(idx>=PROXY_LIST.length)return Promise.reject(new Error('all proxies failed'));
        var proxyUrl=PROXY_LIST[idx](url);
        return fetch(proxyUrl,{signal:safeTimeoutSignal(timeout),cache:'no-store'}).then(function(r){
            if(!r.ok) throw new Error('proxy-'+r.status);
            return r.json();
        }).catch(function(e){
            console.warn('Proxy #'+idx+' failed for '+url.substring(0,60)+': '+e.message);
            return tryProxy(idx+1);
        });
    }
    return tryProxy(0);
}

// ===== Fetch: Sina 新浪财经 (主数据源！JSONP直连，无需代理，实时) =====
// 新浪外盘期货: hf_GC(黄金), hf_OIL(布伦特原油)
// 新浪美股指数: int_nasdaq(纳斯达克), int_sp500(标普), int_hangseng(恒生), int_hstech(恒生科技)
// 新浪A股: s_sh000001(上证), s_sh000905(中证500)
// 新浪韩国: 通过Yahoo
var SINA_MAP={
    BRENT:'hf_OIL',
    GOLD:'hf_GC',
    NASDAQ:'int_nasdaq',
    SP500:'int_sp500',
    HSI:'int_hangseng',
    HSTECH:'rt_hkHSTECH',
    SSEC:'s_sh000001',
    CSI500:'s_sh000905'
};

// 新浪外盘期货格式: 价格,时间,...,昨收,...  字段位置不同
// 新浪指数格式: 名称,当前价,涨跌额,涨跌幅,...
function parseSinaData(symbol,raw){
    if(!raw||raw.length<3)throw new Error('empty sina data');
    var code=SINA_MAP[symbol];
    var p=raw.split(',');

    // A股简要行情: s_sh开头 → 格式: 名称,价格,涨跌额,涨跌幅,成交量,成交额
    if(code.indexOf('s_sh')===0||code.indexOf('s_sz')===0){
        var price=parseFloat(p[1]);
        var chg=parseFloat(p[2]);
        var pct=parseFloat(p[3]);
        if(!price)throw new Error('bad A-share data');
        return{price:price,change:chg,pct:pct};
    }

    // 国际指数: int_ 开头 → 格式: 名称,价格,涨跌额,涨跌幅
    if(code.indexOf('int_')===0){
        var price=parseFloat(p[1]);
        var chg=parseFloat(p[2]);
        var pct=parseFloat(p[3]);
        if(!price)throw new Error('bad int index data');
        return{price:price,change:chg,pct:pct};
    }

    // 港股实时: rt_hk 开头 → 格式: 代码,名称,今开,最高,最高2,最低,当前价,涨跌额,涨跌幅,...
    if(code.indexOf('rt_hk')===0){
        var price=parseFloat(p[6]);
        var chg=parseFloat(p[7]);
        var pct=parseFloat(p[8]);
        if(!price)throw new Error('bad HK rt data');
        return{price:price,change:chg,pct:pct};
    }

    // 外盘期货: hf_ 开头 → 格式: 价格,xxx,昨收,xxx,xxx,日期,时间,...
    if(code.indexOf('hf_')===0){
        var price=parseFloat(p[0]);
        var prevClose=parseFloat(p[7])||parseFloat(p[2]); // 不同品种位置可能不同
        if(!price)throw new Error('bad futures data');
        // 尝试多个位置找昨收
        if(!prevClose||prevClose<=0){
            // 回退：用 p[2] 或 p[7]
            for(var i=2;i<Math.min(p.length,10);i++){
                var v=parseFloat(p[i]);
                if(v>0&&Math.abs(v-price)/price<0.1){prevClose=v;break}
            }
        }
        if(!prevClose)prevClose=price;
        var chg=price-prevClose;
        var pct=prevClose?((chg/prevClose)*100):0;
        return{price:price,change:Math.round(chg*100)/100,pct:Math.round(pct*100)/100};
    }

    throw new Error('unknown sina format');
}

function fetchSina(symbol){
    var code=SINA_MAP[symbol];if(!code)return Promise.reject('no sina code for '+symbol);
    return new Promise(function(ok,fail){
        var s=document.createElement('script');

        var t=setTimeout(function(){cl();fail(new Error('sina timeout'))},6000);
        function cl(){clearTimeout(t);if(s.parentNode)s.parentNode.removeChild(s)}

}

// ===== Refresh =====
var isRefreshing=false;
function refreshAll(){
    if(isRefreshing)return;isRefreshing=true;
    var btn=document.getElementById('refreshBtn');btn.classList.add('loading');
    initCards();

    var all=[];Object.keys(CFG).forEach(function(k){CFG[k].forEach(function(i){all.push(i)})});
    var allMap={};all.forEach(function(item){allMap[item.s]=item});
    var ok=0,total=all.length;

    // 1) 腾讯财经：JSONP请求（带重试，手机网络差时自动重试1次）
    function qqWithRetry(retry){
        return fetchAllQQ().catch(function(e){
            if(retry>0){
                console.warn('QQ请求失败('+e.message+')，500ms后重试...');
                return new Promise(function(r){setTimeout(r,500)}).then(function(){return qqWithRetry(retry-1)});
            }
            throw e;
        });
    }
    var qqDone=qqWithRetry(1).then(function(results){
        Object.keys(results).forEach(function(sym){
            var item=allMap[sym];if(!item)return;
            updCard(item,results[sym]);
            if(!results[sym].error)ok++;
        });
    }).catch(function(e){console.warn('QQ全部失败:',e.message)});

    // 2) 韩国个股：Naver代理（独立并发）
    var krItems=CFG.krMarket.filter(function(i){return NAVER_KR[i.s]});
    var krDone=Promise.allSettled(krItems.map(function(item){
        return fetchKR(item.s).then(function(d){updCard(item,d);if(!d.error)ok++}).catch(function(){updCard(item,{error:true})});
    }));

    // 3) KOSPI + VIX: 读仓库 JSON（GitHub Actions 每分钟更新），失败则走 Yahoo
    var jsonItems=[{sym:'KOSPI',file:'kospi.json',yc:'^KS11'},{sym:'VIX',file:'vix.json',yc:'^VIX'}];
    var jsonDone=Promise.allSettled(jsonItems.map(function(ji){
        var item=allMap[ji.sym];if(!item)return Promise.resolve();
        return fetchJsonData(ji.file).then(function(d){
            updCard(item,d);if(!d.error)ok++;
        }).catch(function(){
            // JSON文件失败，回退 Yahoo CORS proxy
            console.warn(ji.sym+' JSON文件失败, 尝试Yahoo...');
            return fetchYahoo(ji.sym).then(function(d){
                updCard(item,d);if(!d.error)ok++;
            }).catch(function(){
                // Yahoo也失败，检查 localStorage 缓存数据
                var cKey='quote_'+ji.sym;
                try{
                    var c=JSON.parse(localStorage.getItem(cKey));
                    if(c&&c.price){
                        c.stale=true;
                        updCard(item,c);ok++;return;
                    }
                }catch(e){}
                updCard(item,{error:true});
            });
        });
    }));

    // 等所有完成
    Promise.allSettled([qqDone,krDone,jsonDone]).then(function(){
        var now=new Date();
        var ts=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
        var dot=document.getElementById('statusDot'),time=document.getElementById('updateTime');
        if(ok>=total-1){time.innerHTML='<span class="s-label">最后更新</span> <span class="s-time">'+ts+'</span>';dot.className='sdot';toast('✅ 刷新成功')}
        else if(ok>0){time.innerHTML='<span class="s-label">部分更新 '+ok+'/'+total+'</span> <span class="s-time">'+ts+'</span>';dot.className='sdot';toast('⚠️ '+ok+'/'+total+' 更新成功')}
        else{time.innerHTML='<span class="s-label">更新失败</span> <span class="s-time">'+ts+'</span>';dot.className='sdot err';toast('❌ 加载失败')}
        btn.classList.remove('loading');isRefreshing=false;
        // 延迟检测
        checkDelays();
    });
}

// 从仓库 JSON 获取数据（GitHub Actions 每分钟更新）
function fetchJsonData(file){
    return fetch(file+'?_='+Date.now(),{cache:'no-store'}).then(function(r){
        if(!r.ok)throw new Error(file+' http '+r.status);
        return r.json();
    }).then(function(d){
        if(d.error||!d.price)throw new Error('bad data in '+file);
        console.log('✅ '+d.symbol+' (json): price='+d.price+' chg='+d.change+' pct='+d.pct+'%');
        var result={price:d.price,change:d.change,pct:d.pct,source:d.source||'github-actions'};
        // 缓存到 localStorage 作为兜底
        try{localStorage.setItem('quote_'+d.symbol,JSON.stringify(result))}catch(e){}
        return result;
    });
}

// Yahoo带重试
function fetchYahooRetry(symbol,retries){
    return fetchYahoo(symbol).catch(function(e){
        if(retries>0){
            console.warn(symbol+' Yahoo retry, remaining:'+retries);
            return new Promise(function(ok){setTimeout(ok,1500)}).then(function(){return fetchYahooRetry(symbol,retries-1)});
        }
        throw e;
    });
}

// ===== K-LINE CHART =====
var curSym='',curKlt=101,kChart=null;
var maEnabled={5:true,10:true,30:true,200:false};
var klineCache=null; // 当前K线数据缓存（用于均线切换重绘）
var klinePreCache={}; // {sym_klt: {data:[], ts:timestamp}} 预加载缓存
var KLINE_CACHE_TTL=3*60*1000; // 3分钟缓存有效期

// 预缓存存取（带TTL）
function getPreCache(sym,klt){
    var key=sym+'_'+klt;
    var c=klinePreCache[key];
    if(!c)return null;
    if(Date.now()-c.ts>KLINE_CACHE_TTL)return null;
    return c.data;
}
function setPreCache(sym,klt,data){
    klinePreCache[sym+'_'+klt]={data:data,ts:Date.now()};
}

// 所有周期列表
var ALL_KLTS=[101,102,103,5,15,30,60];

function openChart(sym){
    curSym=sym;curKlt=101;
    document.getElementById('cmTitle').textContent=(NAMES[sym]||sym)+' · K线图';
    document.querySelectorAll('.pbtn').forEach(function(b){b.classList.remove('on');b.classList.remove('loading')});
    var dayBtn=document.querySelector('.pbtn[data-k="101"]');
    if(dayBtn){dayBtn.classList.add('on')}
    // 韩国个股不支持分钟K线，隐藏分钟K按钮
    var isKRStock=!!NAVER_KR[sym];
    document.querySelectorAll('.pbtn').forEach(function(b){
        var klt=parseInt(b.getAttribute('data-k'));
        if(klt<100){b.style.display=isKRStock?'none':''}
    });
    // 分隔线也隐藏
    document.querySelectorAll('.psep').forEach(function(s){s.style.display=isKRStock?'none':''});
    document.getElementById('chartModal').classList.add('active');
    document.body.style.overflow='';
    document.body.style.overflow='hidden';
    var dom=document.getElementById('kChart');
    if(kChart){kChart.dispose();kChart=null}

    // 确保弹窗布局完成后再初始化 ECharts
    function initAndLoad(){
        // 检查容器是否有尺寸（手机可能还没布局好）
        if(dom.clientWidth<10||dom.clientHeight<10){
            setTimeout(initAndLoad,30);return;
        }
        kChart=echarts.init(dom,'dark');
        var dayData=getPreCache(sym,101);
        if(dayData&&dayData.length>0){
            document.getElementById('cmLoading').classList.add('hidden');
            klineCache=dayData;renderK(dayData);
            if(dayBtn)dayBtn.classList.remove('loading');
            prefetchOtherKlines(sym,101);
        } else {
            if(dayBtn)dayBtn.classList.add('loading');
            loadK(sym,101,function(){
                if(dayBtn)dayBtn.classList.remove('loading');
                prefetchOtherKlines(sym,101);
            });
        }
    }
    // 用 rAF 等一帧，再检查尺寸
    requestAnimationFrame(initAndLoad);
}
function closeChart(){
    document.getElementById('chartModal').classList.remove('active');
    document.body.style.overflow='';
    if(kChart){kChart.dispose();kChart=null}
    klineCache=null;
    // 不清空 klinePreCache，5分钟内再打开同品种秒显示
}
function sp(btn,klt){
    document.querySelectorAll('.pbtn').forEach(function(b){b.classList.remove('on')});
    btn.classList.add('on');
    curKlt=klt;
    
    // 如果 ECharts 还没初始化好，等它好了再操作
    if(!kChart){
        var dom=document.getElementById('kChart');
        if(dom.clientWidth>10&&dom.clientHeight>10){
            kChart=echarts.init(dom,'dark');
        } else {
            btn.classList.add('loading');
            setTimeout(function(){sp(btn,klt)},100);return;
        }
    }
    
    // 检查预缓存（3分钟内有效），有则秒切
    var cached=getPreCache(curSym,klt);
    if(cached&&cached.length>0){
        document.getElementById('cmLoading').classList.add('hidden');
        btn.classList.remove('loading');
        klineCache=cached;
        renderK(cached);
        return;
    }
    // 没有预缓存，正常加载
    btn.classList.add('loading');
    loadK(curSym,klt,function(){
        btn.classList.remove('loading');
    });
}

// 后台预加载其他周期K线
function prefetchOtherKlines(sym,skipKlt){
    ALL_KLTS.forEach(function(klt){
        if(klt===skipKlt)return;
        if(getPreCache(sym,klt))return; // 已有且未过期
        var btn=document.querySelector('.pbtn[data-k="'+klt+'"]');
        if(btn)btn.classList.add('loading');
        loadKSilent(sym,klt,function(data){
            if(data&&data.length>0){
                setPreCache(sym,klt,data);
                if(curSym===sym&&curKlt===klt){
                    document.getElementById('cmLoading').classList.add('hidden');
                    klineCache=data;renderK(data);
                }
            }
            if(btn)btn.classList.remove('loading');
        });
    });
}

// 静默加载K线（不更新UI/chart，只返回数据）
function loadKSilent(sym,klt,cb){
    // 先检查 localStorage 缓存，有则直接返回
    var lsKey='kline_'+sym+'_'+klt;
    try{
        var lsc=JSON.parse(localStorage.getItem(lsKey));
        if(lsc&&lsc.data&&lsc.data.length>0){cb(lsc.data);return}
    }catch(e){}

    // 韩股
    if(NAVER_KR[sym]){
        loadKNaverSilent(sym,klt,cb);return;
    }
    // VIX — 优先 Longbridge 全周期JSON，然后 DFCF, 最后 Yahoo
    if(sym==='VIX'){
        // Longbridge 全周期 JSON (vix_kline_lb.json): 包含 101/102/103/5/15/30/60 全部周期
        fetch('vix_kline_lb.json?_='+Date.now(),{cache:'no-store'}).then(function(r){
            if(!r.ok)throw new Error('http '+r.status);return r.json();
        }).then(function(data){
            var periods=data&&data.periods;
            if(!periods)throw new Error('no periods');
            var klines=periods[String(klt)];
            if(!klines||!klines.length)throw new Error('no klines for klt='+klt);
            console.log('✅ VIX K线 (Longbridge JSON) klt='+klt+' 条数='+klines.length);
            try{localStorage.setItem(lsKey,JSON.stringify({ts:Date.now(),data:klines}))}catch(e){}
            cb(klines);
        }).catch(function(e){
            console.warn('VIX Longbridge JSON失败('+e.message+'), 尝试旧方案...');
            // 兜底: 日/周/月K 走 vix_kline.json, 分钟K 走 Yahoo
            if(klt>=101){
                fetch('vix_kline.json?_='+Date.now(),{cache:'no-store'}).then(function(r){
                    if(!r.ok)throw new Error('404');return r.json();
                }).then(function(data){
                    var klines=data&&data.klines;
                    if(klines&&klines.length>0){cb(klines);return}
                    cb(null);
                }).catch(function(){
                    loadKYahooSilent('^VIX',klt,cb);
                });
            } else {
                loadKYahooSilent('^VIX',klt,cb);
            }
        });
        return;
    }
    // KOSPI — 优先 DFCF，然后 JSON 文件，最后 Yahoo
    if(sym==='KOSPI'){
        var dfcfSid=DFCF[sym];
        if(dfcfSid){
            fetchDFCFKline(dfcfSid,klt).then(function(parsed){
                try{localStorage.setItem(lsKey,JSON.stringify({ts:Date.now(),data:parsed}))}catch(e){}
                cb(parsed);
            }).catch(function(){
                fetch('kospi_kline.json?_='+Date.now(),{cache:'no-store'}).then(function(r){
                    if(!r.ok)throw new Error('404');return r.json();
                }).then(function(data){
                    var klines=data&&data.klines;
                    if(klines&&klines.length>0){cb(klines);return}
                    cb(null);
                }).catch(function(){
                    loadKYahooSilent('^KS11',klt,cb);
                });
            });
        } else {
            loadKYahooSilent('^KS11',klt,cb);
        }
        return;
    }
    // 普通品种走DFCF（JSONP优先），失败则Yahoo
    var sid=DFCF[sym];if(!sid){cb(null);return}
    fetchDFCFKline(sid,klt).then(function(parsed){
        cb(parsed);
    }).catch(function(){
        // DFCF失败，尝试Yahoo兜底
        var yc=YAHOO_CODES[sym];
        if(yc){loadKYahooSilent(yc,klt,cb)}else{cb(null)}
    });
}

function loadKYahooSilent(yahooCode,klt,cb){
    var iv='1d',rng='6mo';
    if(klt===5){iv='5m';rng='5d'}else if(klt===15){iv='15m';rng='5d'}else if(klt===30){iv='30m';rng='5d'}else if(klt===60){iv='60m';rng='10d'}else if(klt===102){iv='1wk';rng='2y'}else if(klt===103){iv='1mo';rng='5y'}
    var url='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(yahooCode)+'?interval='+iv+'&range='+rng;
    corsFetch(url,6000).then(function(data){
        var res=data&&data.chart&&data.chart.result&&data.chart.result[0];
        if(!res||!res.timestamp){cb(null);return}
        var ts=res.timestamp,q=res.indicators.quote[0];var parsed=[];
        for(var i=0;i<ts.length;i++){
            if(q.open[i]==null)continue;
            var dt=new Date(ts[i]*1000);
            var ds=klt<100?(dt.getMonth()+1)+'/'+dt.getDate()+' '+dt.getHours()+':'+String(dt.getMinutes()).padStart(2,'0'):dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
            parsed.push({date:ds,open:q.open[i],close:q.close[i],high:q.high[i],low:q.low[i],vol:q.volume?q.volume[i]||0:0});
        }
        cb(parsed);
    }).catch(function(){cb(null)});
}

function loadKNaverSilent(sym,klt,cb){
    var code=NAVER_KR[sym];if(!code){cb(null);return}
    // 分钟K韩股不支持
    if(klt<100&&klt!==101){
        // 用日K缓存
        var dayCacheKey='kline_'+sym+'_101';

    var endDt=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0');
    var pt='dayCandle',startDt;
    if(klt===102){pt='weekCandle';startDt=''+(now.getFullYear()-2)+'0101'}
    else if(klt===103){pt='monthCandle';startDt=''+(now.getFullYear()-5)+'0101'}
    else{pt='dayCandle';startDt=''+(now.getFullYear()-1)+String(now.getMonth()+1).padStart(2,'0')+'01'}
    var cacheKey='kline_'+sym+'_'+klt;
    var cached=null;try{cached=JSON.parse(localStorage.getItem(cacheKey))}catch(e){}
    if(cached&&cached.data&&cached.data.length>0){cb(cached.data);return}
    var naverUrl='https://api.stock.naver.com/chart/domestic/item/'+code+'?periodType='+pt+'&startDateTime='+startDt+'&endDateTime='+endDt;
    corsFetch(naverUrl).then(function(data){
        var infos=data&&data.priceInfos;
        if(!infos||!infos.length){cb(null);return}
        var parsed=infos.map(function(p){var d=p.localDate;var ds=d.substring(0,4)+'-'+d.substring(4,6)+'-'+d.substring(6,8);return{date:ds,open:p.openPrice,close:p.closePrice,high:p.highPrice,low:p.lowPrice,vol:p.accumulatedTradingVolume||0}});
        try{localStorage.setItem(cacheKey,JSON.stringify({ts:Date.now(),data:parsed}))}catch(e){}
        cb(parsed);
    }).catch(function(){cb(null)});
}
function refreshKline(){
    var b=document.querySelector('.cm-ref');if(b)b.classList.add('spinning');
    loadK(curSym,curKlt,function(){if(b)b.classList.remove('spinning')});
}
function toggleMA(btn){
    var ma=parseInt(btn.getAttribute('data-ma'));
    maEnabled[ma]=!maEnabled[ma];
    btn.classList.toggle('on');
    if(klineCache)renderK(klineCache);
}

function loadK(sym,klt,cb){
    // 先检查内存预缓存
    var preData=getPreCache(sym,klt);
    if(preData&&preData.length>0){
        document.getElementById('cmLoading').classList.add('hidden');
        klineCache=preData;renderK(preData);if(cb)cb();return;
    }
    // 再检查 localStorage 缓存
    try{
        var lsc=JSON.parse(localStorage.getItem('kline_'+sym+'_'+klt));
        if(lsc&&lsc.data&&lsc.data.length>0){
            document.getElementById('cmLoading').classList.add('hidden');
            klineCache=lsc.data;setPreCache(sym,klt,lsc.data);renderK(lsc.data);if(cb)cb();return;
        }
    }catch(e){}
    
    document.getElementById('cmLoading').classList.remove('hidden');

    // 韩国个股走Naver K线
    if(NAVER_KR[sym]){
        loadKNaver(sym,klt,cb);return;
    }
    // VIX / KOSPI: 多级回退
    if(sym==='VIX'||sym==='KOSPI'){
        var kfile=sym==='VIX'?'vix_kline.json':'kospi_kline.json';
        var yahooKCode=sym==='VIX'?'^VIX':'^KS11';
        var cacheKey='kline_'+sym+'_'+klt;
        var cached=null;
        try{cached=JSON.parse(localStorage.getItem(cacheKey))}catch(e){}
        
        // 先展示缓存（如果有的话）
        if(cached&&cached.data&&cached.data.length>0){
            document.getElementById('cmLoading').classList.add('hidden');
            klineCache=cached.data;renderK(cached.data);
        }

        // VIX: 优先 Longbridge 全周期 JSON (包含全部7个周期)
        if(sym==='VIX'){
            fetch('vix_kline_lb.json?_='+Date.now(),{cache:'no-store'}).then(function(r){
                if(!r.ok)throw new Error('http '+r.status);return r.json();
            }).then(function(data){
                var periods=data&&data.periods;
                if(!periods)throw new Error('no periods');
                var klines=periods[String(klt)];
                if(!klines||!klines.length)throw new Error('no data for klt='+klt);
                console.log('✅ VIX K线 (Longbridge) klt='+klt+' 条数='+klines.length);
                try{localStorage.setItem(cacheKey,JSON.stringify({ts:Date.now(),data:klines}))}catch(e){}
                document.getElementById('cmLoading').classList.add('hidden');
                klineCache=klines;setPreCache(sym,klt,klines);renderK(klines);if(cb)cb();
            }).catch(function(e){
                console.warn('VIX Longbridge JSON失败('+e.message+'), 回退旧方案...');
                // 回退: 日/周/月K走JSON文件, 分钟K走Yahoo
                if(klt>=101){
                    fetch(kfile+'?_='+Date.now(),{cache:'no-store'}).then(function(r){
                        if(!r.ok)throw new Error('404');return r.json();
                    }).then(function(data){
                        var klines=data&&data.klines;
                        if(!klines||!klines.length)throw new Error('empty');
                        try{localStorage.setItem(cacheKey,JSON.stringify({ts:Date.now(),data:klines}))}catch(e){}
                        document.getElementById('cmLoading').classList.add('hidden');
                        klineCache=klines;setPreCache(sym,klt,klines);renderK(klines);if(cb)cb();
                    }).catch(function(){
                        loadKYahoo(sym,yahooKCode,klt,cb);
                    });
                } else {
                    loadKYahoo(sym,yahooKCode,klt,cb);
                }
            });
            return;
        }
        return;
    }

    var sid=DFCF[sym];if(!sid){if(cb)cb();return}
    
    // localStorage 兜底 key
    var lsKey='kline_'+sym+'_'+klt;
    
    // DFCF K线统一获取（JSONP优先，fetch备用）
    fetchDFCFKline(sid,klt).then(function(parsed){
        document.getElementById('cmLoading').classList.add('hidden');
        // 存缓存
        try{localStorage.setItem(lsKey,JSON.stringify({ts:Date.now(),data:parsed}))}catch(e){}
        klineCache=parsed;
        setPreCache(sym,klt,parsed);
        renderK(parsed);if(cb)cb();
    }).catch(function(){
        // DFCF全部失败，尝试 Yahoo CORS 代理
        console.warn(sym+' DFCF K线失败, 尝试Yahoo...');
        var yahooCode=YAHOO_CODES[sym];
        if(yahooCode){
            loadKYahoo(sym,yahooCode,klt,cb);
            return;
        }
        document.getElementById('cmLoading').classList.add('hidden');
        // 无Yahoo代码，尝试 localStorage 兜底
        try{
            var lsc=JSON.parse(localStorage.getItem(lsKey));
            if(lsc&&lsc.data&&lsc.data.length>0){
                klineCache=lsc.data;setPreCache(sym,klt,lsc.data);
                renderK(lsc.data);if(cb)cb();return;
            }
        }catch(e){}
        toast('K线加载失败，请稍后重试');if(cb)cb();
    });
}

function loadKNaver(sym,klt,cb){
    var code=NAVER_KR[sym];if(!code){if(cb)cb();return}
    var now=new Date();
    var endDt=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0');

    // 分钟K线：韩股Naver不支持分钟数据，使用日K缓存展示
    if(klt<100&&klt!==101){
        var dayCacheKey='kline_'+sym+'_101';
        var dayCache=null;
        try{dayCache=JSON.parse(localStorage.getItem(dayCacheKey))}catch(e){}
        if(dayCache&&dayCache.data&&dayCache.data.length>0){
            document.getElementById('cmLoading').classList.add('hidden');
            toast('韩股暂无分钟数据，显示日K缓存');
            klineCache=dayCache.data;renderK(dayCache.data);if(cb)cb();return;
        }
        document.getElementById('cmLoading').classList.add('hidden');
        toast('韩股暂不支持分钟K线');if(cb)cb();return;
    }

    var pt='dayCandle',startDt;
    if(klt===102){pt='weekCandle';startDt=''+(now.getFullYear()-2)+'0101'}
    else if(klt===103){pt='monthCandle';startDt=''+(now.getFullYear()-5)+'0101'}
    else{pt='dayCandle';startDt=''+(now.getFullYear()-1)+String(now.getMonth()+1).padStart(2,'0')+'01'}

    // 检查 localStorage 缓存，增量更新
    var cacheKey='kline_'+sym+'_'+klt;
    var cached=null;
    try{cached=JSON.parse(localStorage.getItem(cacheKey))}catch(e){}
    
    // 如果有缓存，先立即展示缓存（用户零等待），然后后台增量更新
    if(cached&&cached.data&&cached.data.length>0){
        var lastDate=cached.data[cached.data.length-1].date.replace(/-/g,'');
        // 先展示缓存
        document.getElementById('cmLoading').classList.add('hidden');
        klineCache=cached.data;renderK(cached.data);
        // 如果缓存是今天的，不再请求网络
        if(lastDate===endDt){if(cb)cb();return}
        // 后台静默增量更新（不显示loading）
        startDt=lastDate;
    }

    var naverUrl='https://api.stock.naver.com/chart/domestic/item/'+code+'?periodType='+pt+'&startDateTime='+startDt+'&endDateTime='+endDt;
    corsFetch(naverUrl).then(function(data){
        document.getElementById('cmLoading').classList.add('hidden');
        var infos=data&&data.priceInfos;
        if(!infos||!infos.length){
            // 网络无数据但已展示缓存则不报错
            if(cached&&cached.data&&klineCache){if(cb)cb();return}
            toast('暂无K线数据');if(cb)cb();return;
        }
        var parsed=infos.map(function(p){
            var d=p.localDate;
            var ds=d.substring(0,4)+'-'+d.substring(4,6)+'-'+d.substring(6,8);
            return{date:ds,open:p.openPrice,close:p.closePrice,high:p.highPrice,low:p.lowPrice,vol:p.accumulatedTradingVolume||0};
        });
        // 合并缓存
        if(cached&&cached.data){
            var map={};cached.data.forEach(function(k){map[k.date]=k});
            parsed.forEach(function(k){map[k.date]=k});
            parsed=Object.keys(map).sort().map(function(d){return map[d]});
            if(parsed.length>300)parsed=parsed.slice(-300);
        }
        // 存缓存
        try{localStorage.setItem(cacheKey,JSON.stringify({ts:Date.now(),data:parsed}))}catch(e){}
        klineCache=parsed;setPreCache(sym,klt,parsed);renderK(parsed);if(cb)cb();
    }).catch(function(){
        document.getElementById('cmLoading').classList.add('hidden');
        // 网络失败但已展示缓存则静默
        if(cached&&cached.data&&klineCache){if(cb)cb();return}
        // 无缓存无网络
        toast('韩国K线加载失败');if(cb)cb();
    });
}

// ===== Yahoo K-line (VIX etc via CORS proxy) =====
function loadKYahoo(sym,yahooCode,klt,cb){
    var iv='1d',rng='6mo';
    if(klt===5){iv='5m';rng='5d'}
    else if(klt===15){iv='15m';rng='5d'}
    else if(klt===30){iv='30m';rng='5d'}
    else if(klt===60){iv='60m';rng='10d'}
    else if(klt===102){iv='1wk';rng='2y'}
    else if(klt===103){iv='1mo';rng='5y'}
    
    // 先检查 localStorage 缓存，有则先展示
    var cacheKey='kline_'+sym+'_'+klt;
    var cached=null;
    try{cached=JSON.parse(localStorage.getItem(cacheKey))}catch(e){}
    if(cached&&cached.data&&cached.data.length>0){
        // 先渲染缓存
        document.getElementById('cmLoading').classList.add('hidden');
        klineCache=cached.data;renderK(cached.data);
    }
    
    var url='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(yahooCode)+'?interval='+iv+'&range='+rng;
    corsFetch(url,15000).then(function(data){
        document.getElementById('cmLoading').classList.add('hidden');
        var res=data&&data.chart&&data.chart.result&&data.chart.result[0];
        if(!res||!res.timestamp)throw new Error('no data');
        var ts=res.timestamp,q=res.indicators.quote[0];
        var parsed=[];
        for(var i=0;i<ts.length;i++){
            if(q.open[i]==null)continue;
            var dt=new Date(ts[i]*1000);
            var ds=klt<100?(dt.getMonth()+1)+'/'+dt.getDate()+' '+dt.getHours()+':'+String(dt.getMinutes()).padStart(2,'0'):dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
            parsed.push({date:ds,open:q.open[i],close:q.close[i],high:q.high[i],low:q.low[i],vol:q.volume?q.volume[i]||0:0});
        }
        // 存缓存
        try{localStorage.setItem(cacheKey,JSON.stringify({ts:Date.now(),data:parsed}))}catch(e){}
        klineCache=parsed;
        setPreCache(sym,klt,parsed);
        renderK(parsed);if(cb)cb();
    }).catch(function(){
        document.getElementById('cmLoading').classList.add('hidden');
        // 已有缓存渲染则静默
        if(cached&&cached.data&&cached.data.length>0){
            if(cb)cb();return;
        }
        toast(NAMES[sym]+' K线加载失败');if(cb)cb();
    });
}

// Calculate MA
function calcMA(data,period){
    var r=[];
    for(var i=0;i<data.length;i++){
        if(i<period-1){r.push(null);continue}
        var sum=0;for(var j=i-period+1;j<=i;j++)sum+=data[j].close;
        r.push(Math.round(sum/period*100)/100);
    }
    return r;
}

// K线数据格式化：大于1000取整，否则2位小数
function fmtK(v){
    if(v==null||isNaN(v))return'--';
    v=+v;
    if(Math.abs(v)>=1000)return Math.round(v).toLocaleString();
    return v.toFixed(2);
}

function renderK(data){
    if(!kChart){
        // 图表未初始化，延迟重试
        setTimeout(function(){renderK(data)},100);return;
    }
    // 确保容器尺寸正确（手机上模态框打开后可能需要重新计算）
    try{kChart.resize()}catch(e){}
    var dates=[],ohlc=[],vols=[];
    data.forEach(function(d){
        dates.push(d.date);
        ohlc.push([d.open,d.close,d.low,d.high]);
        vols.push({value:d.vol||0,itemStyle:{color:d.close>=d.open?'rgba(239,68,68,0.5)':'rgba(34,197,94,0.5)'}});
    });

    // 检查是否有成交量数据 (VIX 等指数无成交量)
    var hasVolume=vols.some(function(v){return v.value>0});

    var series=[
        {type:'candlestick',data:ohlc,xAxisIndex:0,yAxisIndex:0,itemStyle:{color:'#ef4444',color0:'#22c55e',borderColor:'#ef4444',borderColor0:'#22c55e'},barMinWidth:3,barMaxWidth:14}
    ];
    if(hasVolume){
        series.push({type:'bar',data:vols,xAxisIndex:1,yAxisIndex:1,barWidth:'60%'});
    }

    // 添加均线
    [5,10,30,200].forEach(function(p){
        if(!maEnabled[p])return;
        var maData=calcMA(data,p);
        series.push({type:'line',data:maData,xAxisIndex:0,yAxisIndex:0,symbol:'none',lineStyle:{width:1.2,color:MA_COLORS[p]},name:'MA'+p,smooth:true});
    });

    // X轴标签格式化：参考长桥风格
    var isMinute=curKlt<100;

    function fmtXLabel(val){
        if(!val)return'';
        if(isMinute){
            // 分钟K: "4/2 15:30" → "04.02 15:30"
            var parts=val.split(' ');
            if(parts.length>=2){
                return parts[0].replace('/','.') + ' ' + parts[1];
            }
            return val;
        }
        // 日/周/月K: "2026-04-02" → "04.02"
        if(val.length>=10){
            return val.substring(5,7)+'.'+val.substring(8,10);
        }
        return val;
    }

    var opt={
        backgroundColor:'#060b14',
        animation:false,
        tooltip:{trigger:'axis',axisPointer:{type:'cross',lineStyle:{color:'#3b82f655'},crossStyle:{color:'#3b82f655'}},backgroundColor:'rgba(15,22,33,0.95)',borderColor:'#1c2740',textStyle:{color:'#f1f5f9',fontSize:12},
            formatter:function(ps){
                if(!ps||!ps.length)return'';
                var d=ps[0];var ax=d.axisValue;
                var html='<b style="color:#94a3b8">'+ax+'</b><br/>';
                ps.forEach(function(p){
                    if(p.seriesType==='candlestick'&&p.data){
                        var o=p.data[1],c=p.data[2],l=p.data[3],h=p.data[4];
                        var chg=c-o;var cl=chg>=0?'#ef4444':'#22c55e';
                        html+='<span style="color:#94a3b8">开</span> '+fmtK(o)+' <span style="color:#94a3b8">收</span> <span style="color:'+cl+'"><b>'+fmtK(c)+'</b></span><br/><span style="color:#94a3b8">高</span> '+fmtK(h)+' <span style="color:#94a3b8">低</span> '+fmtK(l)+'<br/>';
                    } else if(p.seriesType==='line'){
                        html+='<span style="color:'+p.color+'">'+p.seriesName+': '+(p.data!=null?fmtK(p.data):'--')+'</span><br/>';
                    }
                });
                return html;
            }
        },
        axisPointer:{link:[{xAxisIndex:'all'}]},
        grid:hasVolume?[
            {left:60,right:12,top:'5%',height:'58%'},
            {left:60,right:12,top:'68%',height:'18%'}
        ]:[
            {left:60,right:12,top:'5%',height:'82%'}
        ],
        xAxis:hasVolume?[
            {type:'category',data:dates,gridIndex:0,
                axisLine:{lineStyle:{color:'#1e293b'}},
                axisTick:{show:false},
                axisLabel:{color:'#94a3b8',fontSize:10,formatter:fmtXLabel,margin:6,hideOverlap:true},
                splitLine:{show:false}
            },
            {type:'category',data:dates,gridIndex:1,
                axisLine:{lineStyle:{color:'#1e293b'}},
                axisTick:{show:false},
                axisLabel:{show:false},
                splitLine:{show:false}
            }
        ]:[
            {type:'category',data:dates,gridIndex:0,
                axisLine:{lineStyle:{color:'#1e293b'}},
                axisTick:{show:false},
                axisLabel:{color:'#94a3b8',fontSize:10,formatter:fmtXLabel,margin:6,hideOverlap:true},
                splitLine:{show:false}
            }
        ],
        yAxis:hasVolume?[
            {scale:true,gridIndex:0,position:'left',
                splitLine:{lineStyle:{color:'#111827',type:'dashed'}},
                axisLine:{show:false},
                axisTick:{show:false},
                axisLabel:{color:'#94a3b8',fontSize:11,margin:8,formatter:function(v){return fmtK(v)}}
            },
            {scale:true,gridIndex:1,position:'left',splitNumber:2,
                splitLine:{show:false},
                axisLine:{show:false},
                axisTick:{show:false},
                axisLabel:{color:'#64748b',fontSize:10,margin:8,formatter:function(v){if(v>=1e9)return(v/1e9).toFixed(1)+'B';if(v>=1e6)return(v/1e6).toFixed(1)+'M';if(v>=1e3)return(v/1e3).toFixed(0)+'K';return v}}
            }
        ]:[
            {scale:true,gridIndex:0,position:'left',
                splitLine:{lineStyle:{color:'#111827',type:'dashed'}},
                axisLine:{show:false},
                axisTick:{show:false},
                axisLabel:{color:'#94a3b8',fontSize:11,margin:8,formatter:function(v){return fmtK(v)}}
            }
        ],
        dataZoom:[
            {type:'inside',xAxisIndex:hasVolume?[0,1]:[0],start:data.length>80?Math.max(0,100-80/data.length*100):0,end:100},
            {type:'slider',xAxisIndex:hasVolume?[0,1]:[0],bottom:'1%',height:16,borderColor:'transparent',backgroundColor:'#0f172a',fillerColor:'rgba(59,130,246,0.2)',handleStyle:{color:'#3b82f6',borderColor:'#3b82f6'},dataBackground:{lineStyle:{color:'#1e293b'},areaStyle:{color:'#0f172a'}},selectedDataBackground:{lineStyle:{color:'#3b82f6'},areaStyle:{color:'rgba(59,130,246,0.1)'}},textStyle:{color:'#64748b',fontSize:10}}
        ],
        series:series
    };
    kChart.setOption(opt,true);
    // 手机兼容：延迟再 resize 一次确保绘制
    setTimeout(function(){if(kChart)kChart.resize()},100);
}

// ===== 市场状态 & 节假日 =====
var MARKETS=[
    {id:'cn', name:'🇨🇳 A股', open:570, close:900, tz:8, days:[1,2,3,4,5]},   // 09:30-15:00
    {id:'hk', name:'🇭🇰 港股', open:570, close:960, tz:8, days:[1,2,3,4,5]},   // 09:30-16:00
    {id:'kr', name:'🇰🇷 韩股', open:540, close:930, tz:9, days:[1,2,3,4,5]},   // 09:00-15:30 KST→CST-1h
    {id:'us', name:'🇺🇸 美股', open:1290, close:1680, tz:-4, days:[1,2,3,4,5]} // 21:30-04:00 CST(=9:30-16:00 ET)
];
// 节假日/休市（格式 YYYY-MM-DD → 原因）
var HOLIDAYS={
    'cn':{'2026-04-04':'清明节','2026-04-05':'清明节','2026-04-06':'清明节','2026-05-01':'劳动节','2026-05-02':'劳动节','2026-05-03':'劳动节','2026-10-01':'国庆节'},
    'hk':{'2026-04-03':'耶稣受难节','2026-04-04':'耶稣受难节翌日','2026-04-05':'复活节','2026-04-07':'复活节星期一','2026-05-01':'劳动节','2026-05-25':'佛诞'},
    'kr':{'2026-04-03':'韩国正常交易'},
    'us':{'2026-04-03':'耶稣受难节','2026-05-25':'阵亡将士纪念日','2026-07-03':'独立日(提前)'}
};
function getMarketStatus(mkt){
    var now=new Date();
    var today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    var dow=now.getDay(); // 0=Sun
    var hols=HOLIDAYS[mkt.id]||{};
    // 节假日
    if(hols[today]&&hols[today].indexOf('正常')<0) return{state:'holiday',reason:hols[today]};
    // 周末
    if(mkt.days.indexOf(dow)<0) return{state:'closed',reason:'周末'};
    // 计算本地分钟（CST=UTC+8）
    var h=now.getHours(),m=now.getMinutes(),t=h*60+m;
    var open=mkt.open,cl=mkt.close;
    // 美股跨日处理
    if(mkt.id==='us'){
        if(t>=1290||t<=240) return{state:'open',reason:''};
        if(t<1290&&t>240) return{state:'closed',reason:'盘前/盘后'};
    }
    if(t>=open&&t<=cl) return{state:'open',reason:''};
    if(t<open) return{state:'closed',reason:fmt2(open)+'开盘'};
    return{state:'closed',reason:'已收盘'};
}
function fmt2(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}

function renderMarketBar(){
    var bar=document.getElementById('mktBar');if(!bar)return;
    var openList=[],closedList=[];
    MARKETS.forEach(function(mkt){
        var st=getMarketStatus(mkt);
        if(st.state==='open') openList.push({mkt:mkt,st:st});
        else closedList.push({mkt:mkt,st:st});
    });
    var html='';
    // 开市行
    if(openList.length>0){
        html+='<div class="mkt-row">';
        openList.forEach(function(item,idx){
            if(idx>0)html+='<span class="mkt-sep"></span>';
            html+='<span class="mkt-item open"><span class="mi-dot"></span><span class="mi-name">'+item.mkt.name+'</span><span class="mi-status">开盘中</span></span>';
        });
        html+='</div>';
    }
    // 休市行
    if(closedList.length>0){
        html+='<div class="mkt-row">';
        closedList.forEach(function(item,idx){
            if(idx>0)html+='<span class="mkt-sep"></span>';
            var cls=item.st.state;
            var txt=item.st.state==='holiday'?'休市 · '+item.st.reason:(item.st.reason||'休市');
            html+='<span class="mkt-item '+cls+'"><span class="mi-dot"></span><span class="mi-name">'+item.mkt.name+'</span><span class="mi-status">'+txt+'</span></span>';
        });
        html+='</div>';
    }
    bar.innerHTML=html;
}

function isAnyMarketOpen(){
    for(var i=0;i<MARKETS.length;i++){if(getMarketStatus(MARKETS[i]).state==='open')return MARKETS[i].name}
    return false;
}
function getRefreshInterval(){
    return isAnyMarketOpen() ? 20*1000 : 2*60*60*1000;
}
var _autoTimer=null;
var _delayTimer=null;
var _lastMarketState=false;
function scheduleNext(){
    if(_autoTimer)clearTimeout(_autoTimer);
    renderMarketBar();
    var iv=getRefreshInterval();
    var curState=isAnyMarketOpen();
    if(curState&&!_lastMarketState){
        console.log('🔔 '+curState+'开盘，立即刷新');
        refreshAll();
    }
    _lastMarketState=curState;
    _autoTimer=setTimeout(function(){scheduleNext();refreshAll()},iv);
    var sec=Math.round(iv/1000);
    var label=sec>=3600?(sec/3600)+'h':sec>=60?Math.round(sec/60)+'min':sec+'s';
    var el=document.getElementById('nextRefresh');
    if(el){
        el.className=curState?'snext':'snext closed';
        el.textContent=(curState?'🟢 开盘中':'🌙 休市')+' · '+label+'后刷新';
    }
    // 持续检查延迟状态（每10秒更新一次延迟标识）
    if(_delayTimer)clearInterval(_delayTimer);
    _delayTimer=setInterval(checkDelays,10000);
}

// ===== Init =====
initCards();refreshAll();scheduleNext();

// 网络恢复时自动刷新（手机网络不稳定时）
window.addEventListener('online',function(){
    console.log('🌐 网络恢复，自动刷新');
    toast('🌐 网络恢复');
    setTimeout(refreshAll,500);
});
// 页面可见时（从后台切回来）检查是否需要刷新
document.addEventListener('visibilitychange',function(){
    if(!document.hidden){
        var el=document.getElementById('updateTime');
        var last=el?el.textContent:'';
        // 如果上次更新超过2分钟，自动刷新
        var match=last.match(/(\d+):(\d+):(\d+)/);
        if(match){
            var now=new Date();var lastSec=parseInt(match[1])*3600+parseInt(match[2])*60+parseInt(match[3]);
            var nowSec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
            if(nowSec-lastSec>120||nowSec-lastSec<0){refreshAll()}
        }
    }
});
