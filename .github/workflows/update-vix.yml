name: Update VIX & KOSPI Data

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install akshare --quiet

      - name: Fetch data
        run: |
          python3 << 'PYEOF'
          import json, datetime, sys

          results = {}

          # ===== 方案1: AKShare (免费,无需token) =====
          try:
              import akshare as ak

              # VIX
              try:
                  df = ak.index_vix()
                  if df is not None and len(df) > 0:
                      row = df.iloc[-1]
                      # 尝试找到 VIX 相关列
                      print(f"AKShare VIX columns: {list(df.columns)}", file=sys.stderr)
                      print(f"AKShare VIX last row: {row.to_dict()}", file=sys.stderr)
                      results['vix_ak'] = True
              except Exception as e:
                  print(f"AKShare VIX error: {e}", file=sys.stderr)

              # KOSPI
              try:
                  df = ak.stock_board_global_index_name_em()
                  print(f"AKShare global index sample: {df.head(3).to_dict()}", file=sys.stderr)
              except Exception as e:
                  print(f"AKShare global index error: {e}", file=sys.stderr)

              # 尝试东方财富外盘指数
              try:
                  df = ak.index_global_em()
                  if df is not None and len(df) > 0:
                      print(f"AKShare global EM columns: {list(df.columns)}", file=sys.stderr)
                      # 找 KOSPI
                      kospi_rows = df[df.apply(lambda r: 'KOSPI' in str(r.values) or '韩国' in str(r.values), axis=1)]
                      if len(kospi_rows) > 0:
                          print(f"AKShare KOSPI: {kospi_rows.iloc[0].to_dict()}", file=sys.stderr)
                          results['kospi_ak'] = True
                      # 找 VIX
                      vix_rows = df[df.apply(lambda r: 'VIX' in str(r.values) or '恐慌' in str(r.values), axis=1)]
                      if len(vix_rows) > 0:
                          print(f"AKShare VIX from global: {vix_rows.iloc[0].to_dict()}", file=sys.stderr)
                          results['vix_global_ak'] = True
              except Exception as e:
                  print(f"AKShare global EM error: {e}", file=sys.stderr)

          except ImportError:
              print("AKShare not installed", file=sys.stderr)

          # ===== 方案2: Yahoo Finance (urllib, 免费) =====
          import urllib.request
          def fetch_yahoo(symbol, yahoo_code):
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{yahoo_code}?interval=1d&range=5d"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read())
                  meta = data["chart"]["result"][0]["meta"]
                  price = meta["regularMarketPrice"]
                  prev = meta.get("chartPreviousClose", meta.get("previousClose", price))
                  chg = round(price - prev, 2)
                  pct = round((price - prev) / prev * 100, 2) if prev else 0
                  return {"symbol": symbol, "price": price, "change": chg, "pct": pct,
                          "prev": prev, "time": datetime.datetime.utcnow().isoformat() + "Z",
                          "source": "yahoo"}
              except Exception as e:
                  print(f"Yahoo {symbol} error: {e}", file=sys.stderr)
                  return None

          # 汇总: 优先 AKShare, 备用 Yahoo
          now = datetime.datetime.utcnow().isoformat() + "Z"

          # VIX
          vix_data = None
          if 'vix_global_ak' in results or 'vix_ak' in results:
              try:
                  import akshare as ak
                  # 尝试从全球指数获取
                  df = ak.index_global_em()
                  vix_rows = df[df.apply(lambda r: 'VIX' in str(r.values) or '恐慌' in str(r.values), axis=1)]
                  if len(vix_rows) > 0:
                      row = vix_rows.iloc[0]
                      cols = list(df.columns)
                      # 通常列: 指数名称, 最新价, 涨跌额, 涨跌幅, ...
                      price = float(row.iloc[1]) if len(cols) > 1 else None
                      chg = float(row.iloc[2]) if len(cols) > 2 else 0
                      pct = float(row.iloc[3]) if len(cols) > 3 else 0
                      if price:
                          vix_data = {"symbol": "VIX", "price": price, "change": chg, "pct": pct,
                                      "prev": round(price - chg, 2), "time": now, "source": "akshare"}
              except Exception as e:
                  print(f"AKShare VIX extract error: {e}", file=sys.stderr)

          if not vix_data:
              vix_data = fetch_yahoo("VIX", "%5EVIX")

          if vix_data:
              with open("vix.json", "w") as f:
                  json.dump(vix_data, f)
              print(f"✅ VIX: {vix_data['price']} ({vix_data['change']:+.2f}, {vix_data['pct']:+.2f}%) [{vix_data['source']}]")

          # KOSPI
          kospi_data = None
          if 'kospi_ak' in results:
              try:
                  import akshare as ak
                  df = ak.index_global_em()
                  kospi_rows = df[df.apply(lambda r: 'KOSPI' in str(r.values) or '韩国' in str(r.values), axis=1)]
                  if len(kospi_rows) > 0:
                      row = kospi_rows.iloc[0]
                      price = float(row.iloc[1])
                      chg = float(row.iloc[2])
                      pct = float(row.iloc[3])
                      if price:
                          kospi_data = {"symbol": "KOSPI", "price": price, "change": chg, "pct": pct,
                                        "prev": round(price - chg, 2), "time": now, "source": "akshare"}
              except Exception as e:
                  print(f"AKShare KOSPI extract error: {e}", file=sys.stderr)

          if not kospi_data:
              kospi_data = fetch_yahoo("KOSPI", "%5EKS11")

          if kospi_data:
              with open("kospi.json", "w") as f:
                  json.dump(kospi_data, f)
              print(f"✅ KOSPI: {kospi_data['price']} ({kospi_data['change']:+.2f}, {kospi_data['pct']:+.2f}%) [{kospi_data['source']}]")

          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vix.json kospi.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto: update VIX+KOSPI $(date -u +%H:%M)"
            git push
          fi