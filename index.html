<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="市场看板">
    <meta name="theme-color" content="#0a0e17">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <title>全球市场看板</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
        :root {
            --bg: #060b14; --bg2: #0f1621; --bg3: #182030; --border: #1c2740;
            --t1: #f1f5f9; --t2: #94a3b8; --t3: #4a5b78;
            --up: #ef4444; --up-bg: rgba(239,68,68,0.07); --up-bd: rgba(239,68,68,0.18);
            --dn: #22c55e; --dn-bg: rgba(34,197,94,0.07); --dn-bd: rgba(34,197,94,0.18);
            --acc: #3b82f6; --acc2: #8b5cf6; --gold: #f59e0b;
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Inter','Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--t1);min-height:100dvh;overflow-x:hidden}

        /* Header */
        .hdr{position:sticky;top:0;z-index:100;background:rgba(6,11,20,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:14px 20px}
        .hdr-in{max-width:840px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
        .hdr-l{display:flex;align-items:center;gap:12px}
        .logo{width:38px;height:38px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 12px rgba(59,130,246,0.25)}
        .hdr-t{font-size:17px;font-weight:800;letter-spacing:-0.4px;background:linear-gradient(90deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .hdr-st{font-size:10px;color:var(--t3);margin-top:1px;letter-spacing:0.5px;text-transform:uppercase}
        .rbtn{display:flex;align-items:center;gap:7px;padding:9px 18px;background:linear-gradient(135deg,var(--acc),#6366f1);color:#fff;border:none;border-radius:11px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all .2s;box-shadow:0 2px 10px rgba(59,130,246,0.3)}
        .rbtn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,0.4)}
        .rbtn:active{transform:scale(.96)}
        .rbtn.loading .ri{animation:spin .8s linear infinite}
        @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
        .ri{font-size:14px;display:inline-block}

        /* Status */
        .sbar{max-width:840px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:8px}
        .sdot{width:6px;height:6px;border-radius:50%;background:var(--dn);animation:pulse 2s infinite}
        .sdot.err{background:var(--up);animation:none}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .stime{font-size:11px;color:var(--t3)}

        /* Main */
        .main{max-width:840px;margin:0 auto;padding:0 14px 100px}

        /* Section */
        .sec{margin-bottom:20px}
        .sec-h{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
        .sec-i{font-size:18px}
        .sec-t{font-size:15px;font-weight:700;color:var(--t1)}
        .sec-b{font-size:10px;padding:2px 8px;background:rgba(59,130,246,0.1);color:var(--acc);border-radius:20px;font-weight:600;letter-spacing:0.3px}

        /* Grid */
        .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
        @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:840px){.grid.wide{grid-template-columns:repeat(4,1fr)}}

        /* Card */
        .card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px 14px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:14px 14px 0 0;opacity:0;transition:opacity .3s}
        .card.up{background:var(--up-bg);border-color:var(--up-bd)}.card.up::before{background:linear-gradient(90deg,var(--up),transparent);opacity:1}
        .card.down{background:var(--dn-bg);border-color:var(--dn-bd)}.card.down::before{background:linear-gradient(90deg,var(--dn),transparent);opacity:1}
        .card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
        .card:active{transform:scale(.98)}
        .c-name{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:10px;display:flex;align-items:center;gap:5px}
        .c-flag{font-size:13px}
        .c-price{font-size:24px;font-weight:800;letter-spacing:-0.5px;line-height:1.1;margin-bottom:7px;font-variant-numeric:tabular-nums}
        .card.up .c-price{color:var(--up)}.card.down .c-price{color:var(--dn)}.card.flat .c-price{color:var(--t2)}
        .c-chg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
        .card.up .c-chg{color:var(--up)}.card.down .c-chg{color:var(--dn)}.card.flat .c-chg{color:var(--t3)}
        .c-badge{padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700}
        .card.up .c-badge{background:rgba(239,68,68,0.13)}.card.down .c-badge{background:rgba(34,197,94,0.13)}
        .c-hint{font-size:9px;color:var(--t3);margin-top:6px;opacity:0;transition:opacity .3s}.card:hover .c-hint{opacity:1}

        /* Loading skeleton */
        .card.ld .c-price,.card.ld .c-chg{background:linear-gradient(90deg,#1c2740 25%,#253350 50%,#1c2740 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:5px;color:transparent!important}
        .card.ld .c-price{width:75%;height:28px}.card.ld .c-chg{width:55%;height:16px}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

        /* Error */
        .c-err{display:none;position:absolute;inset:0;background:rgba(6,11,20,0.88);border-radius:14px;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:11px;color:var(--t3)}
        .card.error .c-err{display:flex}

        /* Footer */
        .foot{text-align:center;padding:24px 20px;color:var(--t3);font-size:10px;line-height:1.8}

        /* Toast */
        .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:#1c2740;color:var(--t1);padding:10px 22px;border-radius:11px;font-size:13px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,0.4);border:1px solid var(--border);transition:transform .4s cubic-bezier(.16,1,.3,1);z-index:3000;white-space:nowrap}
        .toast.show{transform:translateX(-50%) translateY(0)}

        /* ===== Chart Modal ===== */
        .cmodal{display:none;position:fixed;inset:0;z-index:2000;background:var(--bg);flex-direction:column}
        .cmodal.active{display:flex}
        .cm-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
        .cm-title{font-size:15px;font-weight:700;color:var(--t1)}
        .cm-btns{display:flex;gap:6px}
        .cm-ref{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--t1);font-size:14px;cursor:pointer;transition:all .2s}
        .cm-ref:hover{background:var(--bg3)}.cm-ref:active{transform:scale(.95)}.cm-ref.spinning{animation:spin .8s linear infinite}
        .cm-back{padding:7px 16px;border-radius:8px;border:none;background:var(--up);color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s}
        .cm-back:hover{background:#dc2626}.cm-back:active{transform:scale(.95)}
        .cm-periods{display:flex;gap:5px;padding:8px 14px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch}
        .cm-periods::-webkit-scrollbar{display:none}
        .pbtn{padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .2s}
        .pbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
        .pbtn:hover:not(.on){border-color:var(--t3);color:var(--t1)}
        .psep{width:1px;background:var(--border);margin:0 3px;flex-shrink:0}

        /* MA toggle bar */
        .cm-ma{display:flex;gap:5px;padding:6px 14px;border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
        .ma-label{font-size:11px;color:var(--t3);margin-right:4px}
        .ma-btn{padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
        .ma-btn.on{color:#fff}

        .cm-frame{flex:1;position:relative;background:var(--bg)}
        .cm-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:13px;z-index:10}
        .cm-loading.hidden{display:none}

        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#253350;border-radius:3px}
    </style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
    <div class="hdr-l"><div class="logo">📊</div><div><div class="hdr-t">全球市场看板</div><div class="hdr-st">Global Market Dashboard</div></div></div>
    <button class="rbtn" id="refreshBtn" onclick="refreshAll()"><span class="ri">🔄</span><span>刷新</span></button>
</div></header>

<div class="sbar"><div class="sdot" id="statusDot"></div><span class="stime" id="updateTime">等待加载...</span><span class="stime" id="nextRefresh" style="margin-left:12px;opacity:0.6"></span></div>

<main class="main">
    <div class="sec"><div class="sec-h"><span class="sec-i">🛢️</span><span class="sec-t">大宗商品</span><span class="sec-b">Commodities</span></div><div class="grid" id="commodities"></div></div>
    <div class="sec"><div class="sec-h"><span class="sec-i">🇺🇸</span><span class="sec-t">美股指数</span><span class="sec-b">US Market</span></div><div class="grid" id="usMarket"></div></div>
    <div class="sec"><div class="sec-h"><span class="sec-i">🇭🇰</span><span class="sec-t">港股市场</span><span class="sec-b">HK Market</span></div><div class="grid" id="hkMarket"></div></div>
    <div class="sec"><div class="sec-h"><span class="sec-i">🇰🇷</span><span class="sec-t">韩国市场</span><span class="sec-b">Korea</span></div><div class="grid wide" id="krMarket"></div></div>
    <div class="sec"><div class="sec-h"><span class="sec-i">🇨🇳</span><span class="sec-t">A股市场</span><span class="sec-b">China A</span></div><div class="grid" id="cnMarket"></div></div>
</main>

<div class="foot">数据来源: 东方财富 / Yahoo Finance · 仅供参考，不构成投资建议<br>价格可能存在延迟 · 点击卡片查看K线图</div>

<!-- ECharts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

<!-- Chart Modal -->
<div class="cmodal" id="chartModal">
    <div class="cm-bar">
        <div class="cm-title" id="cmTitle">📈 K线图</div>
        <div class="cm-btns"><button class="cm-ref" onclick="refreshKline()">🔄</button><button class="cm-back" onclick="closeChart()">← 返回</button></div>
    </div>
    <div class="cm-periods">
        <button class="pbtn on" data-k="101" onclick="sp(this,101)">日K</button>
        <button class="pbtn" data-k="102" onclick="sp(this,102)">周K</button>
        <button class="pbtn" data-k="103" onclick="sp(this,103)">月K</button>
        <span class="psep"></span>
        <button class="pbtn" data-k="5" onclick="sp(this,5)">5分</button>
        <button class="pbtn" data-k="15" onclick="sp(this,15)">15分</button>
        <button class="pbtn" data-k="30" onclick="sp(this,30)">30分</button>
        <button class="pbtn" data-k="60" onclick="sp(this,60)">60分</button>
    </div>
    <div class="cm-ma">
        <span class="ma-label">均线</span>
        <button class="ma-btn on" data-ma="5" style="color:#f59e0b;border-color:#f59e0b55" onclick="toggleMA(this)">MA5</button>
        <button class="ma-btn on" data-ma="10" style="color:#3b82f6;border-color:#3b82f655" onclick="toggleMA(this)">MA10</button>
        <button class="ma-btn on" data-ma="30" style="color:#a855f7;border-color:#a855f755" onclick="toggleMA(this)">MA30</button>
        <button class="ma-btn" data-ma="200" style="color:#ef4444;border-color:#ef444455" onclick="toggleMA(this)">MA200</button>
    </div>
    <div class="cm-frame"><div class="cm-loading" id="cmLoading">⏳ 加载K线数据...</div><div id="kChart" style="width:100%;height:100%"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
var CFG = {
    commodities:[
        {s:'BRENT',n:'布伦特原油',f:'🛢️',d:2},
        {s:'GOLD',n:'纽约黄金',f:'🥇',d:1}
    ],
    usMarket:[
        {s:'NASDAQ',n:'纳斯达克',f:'📈',d:2},
        {s:'SP500',n:'标普500',f:'📊',d:2}
    ],
    hkMarket:[
        {s:'HSI',n:'恒生指数',f:'🇭🇰',d:2},
        {s:'HSTECH',n:'恒生科技',f:'🇭🇰',d:2}
    ],
    krMarket:[
        {s:'KOSPI',n:'韩国综合',f:'📊',d:2},
        {s:'SKHYNIX',n:'SK海力士',f:'💾',d:0},
        {s:'SAMSUNG',n:'三星电子',f:'📱',d:0}
    ],
    cnMarket:[
        {s:'SSEC',n:'上证指数',f:'🇨🇳',d:2},
        {s:'CSI500',n:'中证500',f:'🇨🇳',d:2}
    ]
};

// 东方财富 secid
var DFCF={BRENT:'112.B00Y',GOLD:'101.GC00Y',NASDAQ:'100.NDX',SP500:'100.SPX',HSI:'100.HSI',HSTECH:'124.HSTECH',SSEC:'1.000001',CSI500:'1.000905',KOSPI:'100.KS11'};


// Names for chart title
var NAMES={BRENT:'布伦特原油',GOLD:'纽约黄金',NASDAQ:'纳斯达克',SP500:'标普500',HSI:'恒生指数',HSTECH:'恒生科技',KOSPI:'韩国综合',SKHYNIX:'SK海力士',SAMSUNG:'三星电子',SSEC:'上证指数',CSI500:'中证500'};

// MA colors
var MA_COLORS={5:'#f59e0b',10:'#3b82f6',30:'#a855f7',200:'#ef4444'};

// ===== JSONP =====
var _cid=0;
function jsonpFetch(url,timeout){
    timeout=timeout||10000;
    return new Promise(function(ok,fail){
        var cb='_cb'+(++_cid)+'_'+Date.now();
        var u=url+(url.indexOf('?')>-1?'&':'?')+'cb='+cb+'&_='+Date.now();
        var s=document.createElement('script');
        var t=setTimeout(function(){cl();fail(new Error('timeout'))},timeout);
        function cl(){clearTimeout(t);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s)}
        window[cb]=function(d){cl();ok(d)};
        s.onerror=function(){cl();fail(new Error('err'))};
        s.src=u;document.head.appendChild(s);
    });
}

// ===== CORS Proxy helper =====
function corsFetch(url,timeout){
    timeout=timeout||12000;
    return fetch('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url),{signal:AbortSignal.timeout(timeout)})
    .then(function(r){if(!r.ok)throw new Error('proxy '+r.status);return r.json()});
}

// ===== Helpers =====
function fmt(n,d){if(n==null||isNaN(n))return'--';return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtC(c,d){if(c==null||isNaN(c))return'--';return(c>=0?'+':'')+Number(c).toFixed(d)}
function fmtP(p){if(p==null||isNaN(p))return'--';return(p>=0?'+':'')+Number(p).toFixed(2)+'%'}
function dir(c){return c>0?'up':c<0?'down':'flat'}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},3000)}

// ===== Render =====
function mkCard(item,ld){
    var c=document.createElement('div');
    c.className='card'+(ld?' ld':'');c.id='c-'+item.s;
    c.onclick=function(){openChart(item.s)};
    c.innerHTML='<div class="c-name"><span class="c-flag">'+item.f+'</span>'+item.n+'</div><div class="c-price">'+(ld?'----':'--')+'</div><div class="c-chg">'+(ld?'----':'--')+'</div><div class="c-hint">点击查看K线 →</div><div class="c-err"><span>⚠️</span><span>加载失败</span></div>';
    return c;
}
function updCard(item,data){
    var c=document.getElementById('c-'+item.s);if(!c)return;
    c.className='card';
    if(!data||data.error){c.classList.add('error');return}
    var d=dir(data.change);c.classList.add(d);
    var arrow=d==='up'?'▲':d==='down'?'▼':'';
    c.querySelector('.c-price').textContent=fmt(data.price,item.d);
    c.querySelector('.c-chg').innerHTML='<span>'+fmtC(data.change,item.d)+'</span><span class="c-badge">'+arrow+' '+fmtP(data.pct)+'</span>';
}
function initCards(){
    Object.keys(CFG).forEach(function(k){
        var el=document.getElementById(k);if(!el)return;el.innerHTML='';
        CFG[k].forEach(function(item){el.appendChild(mkCard(item,true))});
    });
}

// ===== Fetch: Sina (更实时的外盘数据) =====
var SINA_MAP={GOLD:'hf_GC',BRENT:'hf_OIL'};
function fetchSina(symbol){
    var code=SINA_MAP[symbol];if(!code)return Promise.reject('no sina');
    return new Promise(function(ok,fail){
        var s=document.createElement('script');
        s.charset='utf-8';
        var t=setTimeout(function(){cl();fail(new Error('sina timeout'))},5000);
        function cl(){clearTimeout(t);if(s.parentNode)s.parentNode.removeChild(s)}
        s.onload=function(){
            cl();
            try{
                var raw=window['hq_str_'+code];
                if(!raw)throw new Error('no sina data');
                var p=raw.split(',');
                var price=parseFloat(p[0]);
                var prevClose=parseFloat(p[2]);
                if(!price||!prevClose)throw new Error('bad sina data');
                var chg=price-prevClose;
                var pct=(chg/prevClose)*100;
                ok({price:price,change:Math.round(chg*100)/100,pct:Math.round(pct*100)/100,source:'sina'});
            }catch(e){fail(e)}
        };
        s.onerror=function(){cl();fail(new Error('sina err'))};
        s.src='https://hq.sinajs.cn/list='+code+'&_='+Date.now();
        document.head.appendChild(s);
    });
}

// ===== Fetch: DFCF =====
function fetchDFCF(symbol){
    var sid=DFCF[symbol];if(!sid)return Promise.reject('no dfcf');
    var url='https://push2.eastmoney.com/api/qt/stock/get?secid='+sid+'&fields=f43,f57,f58,f59,f60,f169,f170&ut=fa5fd1943c7b386f172d6893dbbd1';
    return jsonpFetch(url).then(function(r){
        var d=r&&r.data;if(!d||!d.f43||d.f43==='-')throw new Error('no data');
        var dec=(d.f59!=null&&d.f59!=='-')?d.f59:2;
        var dv=Math.pow(10,dec);
        return{price:d.f43/dv,change:d.f169/dv,pct:d.f170/100,source:'dfcf'};
    });
}

// ===== Fetch: Korean stocks (Naver via CORS proxy → direct → static JSON) =====
var NAVER_KR={SKHYNIX:'000660',SAMSUNG:'005930'};
var CORS_PROXIES=[
    function(url){return 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url)},
    function(url){return url} // 直接请求（部分浏览器可能允许）
];
function parseNaverData(d){
    var price=parseInt((d.closePrice||'0').replace(/,/g,''));
    var change=parseInt((d.compareToPreviousClosePrice||'0').replace(/,/g,''));
    var pct=parseFloat(d.fluctuationsRatio||'0');
    if(!price)throw new Error('no price');
    return{price:price,change:change,pct:pct};
}
function fetchKR(symbol){
    var code=NAVER_KR[symbol];if(!code)return Promise.reject('no code');
    var naverUrl='https://m.stock.naver.com/api/stock/'+code+'/basic';
    // 依次尝试各代理
    function tryProxy(idx){
        if(idx>=CORS_PROXIES.length){
            // 所有代理失败 → 回退静态JSON
            return fetch('kr_data.json?_='+Date.now()).then(function(r){return r.json()}).then(function(data){
                var dd=data[symbol];if(!dd||dd.error)throw new Error('no json');
                return{price:dd.price,change:dd.change,pct:dd.pct,source:'json-fallback'};
            });
        }
        var url=CORS_PROXIES[idx](naverUrl);
        return fetch(url).then(function(r){
            if(!r.ok)throw new Error('http '+r.status);
            return r.json();
        }).then(function(d){
            var result=parseNaverData(d);
            result.source='naver'+(idx>0?'-direct':'-proxy');
            return result;
        }).catch(function(){
            return tryProxy(idx+1);
        });
    }
    return tryProxy(0);
}

function fetchQuote(symbol){
    if(NAVER_KR[symbol]){
        return fetchKR(symbol).catch(function(){return{error:true}});
    }
    // 黄金和原油优先用新浪（更实时），失败回退东方财富
    if(SINA_MAP[symbol]){
        return fetchSina(symbol).catch(function(){return fetchDFCF(symbol)}).catch(function(){return{error:true}});
    }
    return fetchDFCF(symbol).catch(function(){return{error:true}});
}

// ===== Refresh =====
var isRefreshing=false;
function refreshAll(){
    if(isRefreshing)return;isRefreshing=true;
    var btn=document.getElementById('refreshBtn');btn.classList.add('loading');
    initCards();
    var all=[];Object.keys(CFG).forEach(function(k){CFG[k].forEach(function(i){all.push(i)})});
    var ok=0,total=all.length;
    Promise.allSettled(all.map(function(item){
        return fetchQuote(item.s).then(function(d){updCard(item,d);if(!d.error)ok++});
    })).then(function(){
        var ts=new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
        var dot=document.getElementById('statusDot'),time=document.getElementById('updateTime');
        if(ok===total){time.textContent='全部更新 · '+ts;dot.className='sdot';toast('✅ 刷新成功')}
        else if(ok>0){time.textContent='部分更新 ('+ok+'/'+total+') · '+ts;dot.className='sdot';toast('⚠️ '+ok+'/'+total+' 更新成功')}
        else{time.textContent='更新失败 · '+ts;dot.className='sdot err';toast('❌ 加载失败')}
        btn.classList.remove('loading');isRefreshing=false;
    });
}

// ===== K-LINE CHART =====
var curSym='',curKlt=101,kChart=null;
var maEnabled={5:true,10:true,30:true,200:false};
var klineCache=null; // cache current klines for MA toggle

function openChart(sym){
    curSym=sym;curKlt=101;
    document.getElementById('cmTitle').textContent=(NAMES[sym]||sym)+' · K线图';
    document.querySelectorAll('.pbtn').forEach(function(b){b.classList.remove('on')});
    document.querySelector('.pbtn[data-k="101"]').classList.add('on');
    document.getElementById('chartModal').classList.add('active');
    document.body.style.overflow='hidden';
    var dom=document.getElementById('kChart');
    if(kChart){kChart.dispose()}
    kChart=echarts.init(dom,'dark');
    loadK(sym,101);
}
function closeChart(){
    document.getElementById('chartModal').classList.remove('active');
    document.body.style.overflow='';
    if(kChart){kChart.dispose();kChart=null}
    klineCache=null;
}
function sp(btn,klt){
    document.querySelectorAll('.pbtn').forEach(function(b){b.classList.remove('on')});
    btn.classList.add('on');curKlt=klt;loadK(curSym,klt);
}
function refreshKline(){
    var b=document.querySelector('.cm-ref');if(b)b.classList.add('spinning');
    loadK(curSym,curKlt,function(){if(b)b.classList.remove('spinning')});
}
function toggleMA(btn){
    var ma=parseInt(btn.getAttribute('data-ma'));
    maEnabled[ma]=!maEnabled[ma];
    btn.classList.toggle('on');
    if(klineCache)renderK(klineCache);
}

function loadK(sym,klt,cb){
    document.getElementById('cmLoading').classList.remove('hidden');

    // For Korean stocks, use Naver K-line
    if(NAVER_KR[sym]){
        loadKNaver(sym,klt,cb);return;
    }

    var sid=DFCF[sym];if(!sid){if(cb)cb();return}
    var url='https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+sid+'&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57&klt='+klt+'&fqt=1&end=20500101&lmt=300&_='+Date.now();
    
    // Try fetch first, fallback JSONP
    fetch(url).then(function(r){return r.json()}).then(handleKResp).catch(function(){
        jsonpFetch(url).then(handleKResp).catch(function(){
            document.getElementById('cmLoading').classList.add('hidden');toast('K线加载失败');if(cb)cb();
        });
    });

    function handleKResp(resp){
        document.getElementById('cmLoading').classList.add('hidden');
        var klines=resp&&resp.data&&resp.data.klines;
        if(!klines||!klines.length){toast('暂无K线数据');if(cb)cb();return}
        // Parse DFCF klines: date,open,close,high,low,volume,amount
        var parsed=klines.map(function(l){var p=l.split(',');return{date:p[0],open:+p[1],close:+p[2],high:+p[3],low:+p[4],vol:+p[5]}});
        klineCache=parsed;
        renderK(parsed);if(cb)cb();
    }
}

function loadKNaver(sym,klt,cb){
    var code=NAVER_KR[sym];if(!code){if(cb)cb();return}
    // Map klt to Naver periodType & date range
    var pt='dayCandle',startDt,endDt;
    var now=new Date();
    endDt=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0');
    // Naver only supports day/week/month candles (no intraday)
    if(klt===102){pt='weekCandle';startDt=''+(now.getFullYear()-2)+'0101'}
    else if(klt===103){pt='monthCandle';startDt=''+(now.getFullYear()-5)+'0101'}
    else{pt='dayCandle';startDt=''+(now.getFullYear()-1)+String(now.getMonth()+1).padStart(2,'0')+'01'}
    // 分钟级(5/15/30/60)目前Naver不支持，降级显示日K
    if(klt<100&&klt!==101){toast('韩股暂仅支持日/周/月K');pt='dayCandle';startDt=''+(now.getFullYear()-1)+String(now.getMonth()+1).padStart(2,'0')+'01'}

    var naverUrl='https://api.stock.naver.com/chart/domestic/item/'+code+'?periodType='+pt+'&startDateTime='+startDt+'&endDateTime='+endDt;
    corsFetch(naverUrl).then(function(data){
        document.getElementById('cmLoading').classList.add('hidden');
        var infos=data&&data.priceInfos;
        if(!infos||!infos.length){toast('暂无K线数据');if(cb)cb();return}
        var parsed=infos.map(function(p){
            var d=p.localDate;
            var ds=d.substring(0,4)+'-'+d.substring(4,6)+'-'+d.substring(6,8);
            return{date:ds,open:p.openPrice,close:p.closePrice,high:p.highPrice,low:p.lowPrice,vol:p.accumulatedTradingVolume||0};
        });
        klineCache=parsed;renderK(parsed);if(cb)cb();
    }).catch(function(){
        document.getElementById('cmLoading').classList.add('hidden');toast('韩国K线加载失败');if(cb)cb();
    });
}

// Calculate MA
function calcMA(data,period){
    var r=[];
    for(var i=0;i<data.length;i++){
        if(i<period-1){r.push(null);continue}
        var sum=0;for(var j=i-period+1;j<=i;j++)sum+=data[j].close;
        r.push(Math.round(sum/period*100)/100);
    }
    return r;
}

function renderK(data){
    if(!kChart)return;
    var dates=[],ohlc=[],vols=[];
    data.forEach(function(d){
        dates.push(d.date);
        ohlc.push([d.open,d.close,d.low,d.high]);
        vols.push({value:d.vol||0,itemStyle:{color:d.close>=d.open?'rgba(239,68,68,0.5)':'rgba(34,197,94,0.5)'}});
    });

    var series=[
        {type:'candlestick',data:ohlc,xAxisIndex:0,yAxisIndex:0,itemStyle:{color:'#ef4444',color0:'#22c55e',borderColor:'#ef4444',borderColor0:'#22c55e'}},
        {type:'bar',data:vols,xAxisIndex:1,yAxisIndex:1,barWidth:'60%'}
    ];

    // Add MA lines
    [5,10,30,200].forEach(function(p){
        if(!maEnabled[p])return;
        var maData=calcMA(data,p);
        series.push({type:'line',data:maData,xAxisIndex:0,yAxisIndex:0,symbol:'none',lineStyle:{width:1.2,color:MA_COLORS[p]},name:'MA'+p,smooth:true});
    });

    var opt={
        backgroundColor:'#060b14',
        animation:false,
        tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'rgba(15,22,33,0.95)',borderColor:'#1c2740',textStyle:{color:'#f1f5f9',fontSize:11},
            formatter:function(ps){
                if(!ps||!ps.length)return'';
                var d=ps[0];var ax=d.axisValue;
                var html='<b>'+ax+'</b><br/>';
                ps.forEach(function(p){
                    if(p.seriesType==='candlestick'&&p.data){
                        var o=p.data[1],c=p.data[2],l=p.data[3],h=p.data[4];
                        var chg=c-o;var cl=chg>=0?'#ef4444':'#22c55e';
                        html+='开:'+o+' 收:<span style="color:'+cl+'">'+c+'</span><br/>高:'+h+' 低:'+l+'<br/>';
                    } else if(p.seriesType==='line'){
                        html+='<span style="color:'+p.color+'">'+p.seriesName+': '+(p.data!=null?p.data:'--')+'</span><br/>';
                    }
                });
                return html;
            }
        },
        axisPointer:{link:[{xAxisIndex:'all'}]},
        grid:[{left:'10%',right:'2%',top:'6%',height:'56%'},{left:'10%',right:'2%',top:'68%',height:'20%'}],
        xAxis:[
            {type:'category',data:dates,gridIndex:0,axisLine:{lineStyle:{color:'#1c2740'}},axisLabel:{color:'#4a5b78',fontSize:9,rotate:dates.length>60?45:0},splitLine:{show:false}},
            {type:'category',data:dates,gridIndex:1,axisLine:{lineStyle:{color:'#1c2740'}},axisLabel:{show:false},splitLine:{show:false}}
        ],
        yAxis:[
            {scale:true,gridIndex:0,splitLine:{lineStyle:{color:'#111827'}},axisLine:{lineStyle:{color:'#1c2740'}},axisLabel:{color:'#4a5b78',fontSize:9}},
            {scale:true,gridIndex:1,splitNumber:2,splitLine:{show:false},axisLine:{lineStyle:{color:'#1c2740'}},axisLabel:{color:'#4a5b78',fontSize:8,formatter:function(v){if(v>=1e9)return(v/1e9).toFixed(1)+'B';if(v>=1e6)return(v/1e6).toFixed(1)+'M';if(v>=1e3)return(v/1e3).toFixed(0)+'K';return v}}}
        ],
        dataZoom:[
            {type:'inside',xAxisIndex:[0,1],start:data.length>100?60:0,end:100},
            {type:'slider',xAxisIndex:[0,1],bottom:'1%',height:14,borderColor:'#1c2740',fillerColor:'rgba(59,130,246,0.15)',handleStyle:{color:'#3b82f6'},textStyle:{color:'#4a5b78',fontSize:8}}
        ],
        series:series
    };
    kChart.setOption(opt,true);
}

window.addEventListener('resize',function(){if(kChart)kChart.resize()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeChart()});

// ===== Smart Auto-Refresh =====
// 港股: 09:30-16:00 HKT (UTC+8) → 每3分钟
// 美股: 21:30-04:00 CST (UTC+8) → 每3分钟
// 韩股: 08:00-15:30 KST (09:00-16:30 CST) → 每3分钟
// 全都不开盘 → 每2小时; 其他时段 → 每15分钟
function getRefreshInterval(){
    var now=new Date();
    var h=now.getHours(),m=now.getMinutes(),t=h*60+m;
    // 港股 09:30-16:00 CST
    if(t>=570&&t<=960) return 3*60*1000;
    // 韩股 09:00-16:30 CST (=KST 10:00-17:30, 这里用中国时间)
    if(t>=480&&t<=990) return 3*60*1000;
    // 美股 21:30-次日04:00 CST
    if(t>=1290||t<=240) return 3*60*1000;
    // A股 09:30-15:00
    if(t>=570&&t<=900) return 3*60*1000;
    // 全都休市的纯休息时段 (05:00-08:00)
    if(t>=300&&t<=480) return 2*60*60*1000;
    // 其他
    return 15*60*1000;
}
var _autoTimer=null;
function scheduleNext(){
    if(_autoTimer)clearTimeout(_autoTimer);
    var iv=getRefreshInterval();
    _autoTimer=setTimeout(function(){refreshAll();scheduleNext()},iv);
    // 显示下次刷新时间
    var sec=Math.round(iv/1000);
    var label=sec>=3600?(sec/3600)+'h':sec>=60?Math.round(sec/60)+'min':sec+'s';
    var el=document.getElementById('nextRefresh');
    if(el)el.textContent='自动刷新: '+label;
}

// ===== Init =====
initCards();refreshAll();scheduleNext();
</script>
