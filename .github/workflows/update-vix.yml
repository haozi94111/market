name: Update VIX & KOSPI Data

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install akshare --quiet

      - name: Fetch data
        run: |
          python3 << 'PYEOF'
          import json, datetime, sys, urllib.request

          now = datetime.datetime.utcnow().isoformat() + "Z"

          # ===== KOSPI: AKShare (东方财富后端, 实时) =====
          kospi_data = None
          try:
              import akshare as ak
              df = ak.index_global_spot_em()
              row = df[df["代码"] == "KS11"]
              if len(row) > 0:
                  r = row.iloc[0]
                  kospi_data = {
                      "symbol": "KOSPI", "price": float(r["最新价"]),
                      "change": float(r["涨跌额"]), "pct": float(r["涨跌幅"]),
                      "prev": float(r["昨收价"]), "time": now, "source": "akshare"
                  }
                  print(f"✅ KOSPI (AKShare): {kospi_data['price']} ({kospi_data['change']:+.2f}, {kospi_data['pct']:+.2f}%)")
          except Exception as e:
              print(f"AKShare KOSPI error: {e}", file=sys.stderr)

          # KOSPI 备用: Yahoo
          if not kospi_data:
              try:
                  url = "https://query1.finance.yahoo.com/v8/finance/chart/%5EKS11?interval=1d&range=5d"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = json.loads(urllib.request.urlopen(req, timeout=10).read())
                  m = data["chart"]["result"][0]["meta"]
                  p, prev = m["regularMarketPrice"], m.get("chartPreviousClose", m.get("previousClose", m["regularMarketPrice"]))
                  kospi_data = {"symbol": "KOSPI", "price": p, "change": round(p-prev, 2),
                                "pct": round((p-prev)/prev*100, 2), "prev": prev, "time": now, "source": "yahoo"}
                  print(f"✅ KOSPI (Yahoo): {p}")
              except Exception as e:
                  print(f"Yahoo KOSPI error: {e}", file=sys.stderr)

          if kospi_data:
              with open("kospi.json", "w") as f:
                  json.dump(kospi_data, f)

          # ===== VIX: Yahoo Finance =====
          vix_data = None
          try:
              url = "https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?interval=1d&range=5d"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              data = json.loads(urllib.request.urlopen(req, timeout=10).read())
              m = data["chart"]["result"][0]["meta"]
              p, prev = m["regularMarketPrice"], m.get("chartPreviousClose", m.get("previousClose", m["regularMarketPrice"]))
              vix_data = {"symbol": "VIX", "price": p, "change": round(p-prev, 2),
                          "pct": round((p-prev)/prev*100, 2), "prev": prev, "time": now, "source": "yahoo"}
              print(f"✅ VIX (Yahoo): {p} ({round(p-prev,2):+.2f}, {round((p-prev)/prev*100,2):+.2f}%)")
          except Exception as e:
              print(f"Yahoo VIX error: {e}", file=sys.stderr)

          if vix_data:
              with open("vix.json", "w") as f:
                  json.dump(vix_data, f)

          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vix.json kospi.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto: update VIX+KOSPI $(date -u +%H:%M)"
            git push
          fi